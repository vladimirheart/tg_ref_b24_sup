spring:
  application:
    name: panel
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:${APP_RABBITMQ_AMQP_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:iguana}
    password: ${SPRING_RABBITMQ_PASSWORD:iguana}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}

  jpa:
    hibernate:
      ddl-auto: none      # правильно, пускай Flyway рулит схемой
    properties:
      hibernate:
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false

  flyway:
    # Main runtime is PostgreSQL-first. FlywayConfig switches this location
    # to sqlite/mysql when the selected datasource mode requires it.
    locations:
      - classpath:db/migration/postgresql
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    placeholders:
      autoIncrement: AUTOINCREMENT

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  thymeleaf:
    encoding: UTF-8

  main:
    banner-mode: off

  session:
    store-type: jdbc
    jdbc:
      table-name: SPRING_SESSION   # только имя таблицы, без initialize-schema / schema

  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:60MB}

app:
  datasource:
    mode: ${APP_DB_MODE:postgresql}
    sqlite:
      path: ${APP_DB_PANEL_RUNTIME:${APP_DB_TICKETS:panel_runtime.db}}
    monitoring-sqlite:
      path: ${APP_DB_MONITORING:monitoring.db}
    users-sqlite:
      path: ${APP_DB_PANEL_IDENTITY:${APP_DB_USERS:panel_identity.db}}
    bot-sqlite:
      path: ${APP_DB_BOT_RUNTIME:${APP_DB_BOT:bot_runtime.db}}
    clients-sqlite:
      path: ${APP_DB_CLIENTS:clients.db}
    knowledge-sqlite:
      path: ${APP_DB_KNOWLEDGE:knowledge_base.db}
    objects-sqlite:
      path: ${APP_DB_OBJECTS:objects.db}
    settings-sqlite:
      path: ${APP_DB_SETTINGS:settings.db}
  bots:
    database-dir: ${APP_BOT_DATABASE_DIR:../bot_databases}
    launch-mode: ${APP_BOT_LAUNCH_MODE:auto} # auto -> prefer explicit/prebuilt jar, fallback to spring-boot:run in dev
    executable-jars: {} # optional explicit module -> jar path map, relative to java-bot or absolute
    preferred-production-launcher: ${APP_BOT_PREFERRED_PRODUCTION_LAUNCHER:jar}
    recommended-artifact-directory: ${APP_BOT_RECOMMENDED_ARTIFACT_DIRECTORY:dist}
    startup-readiness-timeout: ${APP_BOT_STARTUP_READINESS_TIMEOUT:45s}
    startup-poll-interval: ${APP_BOT_STARTUP_POLL_INTERVAL:250ms}
    internal-api:
      token: ${APP_INTERNAL_BOT_API_TOKEN:iguana-internal-bot-token}
  storage:
    attachments: ${APP_STORAGE_ATTACHMENTS:../java-bot/attachments}
    knowledge-base: ${APP_STORAGE_KNOWLEDGE_BASE:${APP_STORAGE_ATTACHMENTS:../java-bot/attachments}/knowledge_base}
    avatars: ${APP_STORAGE_AVATARS:../attachments/avatars}
  integration:
    transport:
      mode: ${APP_INTEGRATION_TRANSPORT_MODE:jdbc}
    rabbitmq:
      inbound-exchange: ${APP_INTEGRATION_RABBITMQ_INBOUND_EXCHANGE:iguana.integration.inbound}
      inbound-queue: ${APP_INTEGRATION_RABBITMQ_INBOUND_QUEUE:iguana.integration.inbound.panel}
      ticket-created-queue: ${APP_INTEGRATION_RABBITMQ_TICKET_CREATED_QUEUE:iguana.integration.ticket-created.panel}
      inbound-dlx: ${APP_INTEGRATION_RABBITMQ_INBOUND_DLX:iguana.integration.inbound.dlx}
      inbound-dlq: ${APP_INTEGRATION_RABBITMQ_INBOUND_DLQ:iguana.integration.inbound.panel.dlq}
      ticket-created-dlq: ${APP_INTEGRATION_RABBITMQ_TICKET_CREATED_DLQ:iguana.integration.ticket-created.panel.dlq}
      outbound-exchange: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_EXCHANGE:iguana.integration.outbound}
      outbound-dlx: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_DLX:iguana.integration.outbound.dlx}
      routing-telegram: ${APP_INTEGRATION_RABBITMQ_ROUTING_TELEGRAM:integration.inbound.telegram}
      routing-vk: ${APP_INTEGRATION_RABBITMQ_ROUTING_VK:integration.inbound.vk}
      routing-max: ${APP_INTEGRATION_RABBITMQ_ROUTING_MAX:integration.inbound.max}
      routing-ticket-created: ${APP_INTEGRATION_RABBITMQ_ROUTING_TICKET_CREATED:integration.inbound.ticket.created}
  admin:
    python-executable: ${APP_ADMIN_PYTHON_EXECUTABLE:python}
    repository-root: ${APP_ADMIN_REPOSITORY_ROOT:}
    storage-inventory-timeout: ${APP_ADMIN_STORAGE_INVENTORY_TIMEOUT:90s}

server:
  port: ${APP_HTTP_PORT:8080}
  tomcat:
    max-swallow-size: ${APP_TOMCAT_MAX_SWALLOW_SIZE:60MB}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    whitelabel:
      enabled: false

logging:
  file:
    name: ${APP_PANEL_LOG_PATH:${APP_PANEL_LOG_DIR:../logs}/spring-panel.log}
  level:
    # Suppress noisy stack traces when HTTPS traffic accidentally hits the HTTP port
    org.apache.coyote.http11.Http11Processor: WARN
