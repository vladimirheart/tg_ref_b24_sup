<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи — iguana</title>
    <link rel="stylesheet" href="/vendor/bootstrap/5.3.3/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="with-sidebar sidebar-pinned"
	  data-ui-page="users"
	  data-ui-density="compact">

<div th:replace="~{fragments/navbar :: navbar('users')}"></div>

<main class="main-content container-fluid">
	<div class="page-shell admin-directory-shell">

		<div class="page-header-card page-header-card--compact admin-directory-header">
			<span class="page-kicker">Администрирование</span>

			<h1 class="page-title">Пользователи</h1>

			<p class="page-subtitle">
				Сотрудники панели, роли, отделы
				и текущее состояние доступа.
			</p>
		</div>

    <div class="card admin-table-card">
		<div class="table-responsive admin-table-shell">
			<table class="table align-middle admin-table">
				<thead>
                <tr>
                    <th>Логин</th>
                    <th>Имя</th>
                    <th>Роль</th>
                    <th>Отдел</th>
                    <th>Email</th>
                    <th>Статус</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="admin-empty-cell">Пользователи не найдены</td>
                </tr>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.fullName} ?: '—'"></td>
                    <td th:text="${user.role} ?: (user.roleRef != null ? user.roleRef.name : '—')"></td>
                    <td th:text="${user.department} ?: '—'"></td>
                    <td th:text="${user.email} ?: '—'"></td>
                    <td>
                        <span class="admin-status-badge"
							  th:classappend="${user.blocked}
								  ? ' admin-status-badge--inactive'
								  : ' admin-status-badge--active'"
							  th:text="${user.blocked} ? 'Заблокирован' : 'Активен'"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    </div>
</main>
<script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
