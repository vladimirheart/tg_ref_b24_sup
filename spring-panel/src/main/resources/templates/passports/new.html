<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-XSRF-TOKEN'}" />
  <title>Паспорт объекта — iguana</title>
  <link rel="icon"
      type="image/png"
      sizes="32x32"
      th:href="@{/favicon-32x32.png?v=2}">

	<link rel="icon"
      type="image/png"
      sizes="16x16"
      th:href="@{/favicon-16x16.png?v=2}">

	<link rel="shortcut icon"
      type="image/x-icon"
      th:href="@{/favicon.ico?v=2}">

	<link rel="apple-touch-icon"
      sizes="180x180"
      th:href="@{/favicon-180x180.png?v=2}">
  <link rel="stylesheet"
      href="/vendor/bootstrap/5.3.3/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">

<th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="with-sidebar sidebar-pinned passport-editor-page" data-ui-page="passports">
  <div th:replace="~{fragments/navbar :: navbar('passports')}"></div>
  <main class="main-content container-fluid py-4 page-shell passports-page-shell ops-page-shell">
    <div class="passport-container">
      <div class="page-header-card passports-page-header passport-editor-header mb-4 ops-page-header">
			<div class="passport-editor-identity">
				<div>
					<span class="page-kicker">Инфраструктура объекта</span>

					<h1 class="page-title">Паспорт объекта</h1>

					<div class="page-subtitle object-title" data-no-disclosure
						 id="objectTitle">
						—
					</div>

					<div class="passport-editor-badges">
						<span class="badge status-badge passport-object-status"
							  id="statusBadge"
							  data-state="neutral">
							—
						</span>

						<span class="badge status-badge passport-network-badge"
							  id="networkBadge"
							  data-state="neutral">
							Внутренняя сеть: —
						</span>
					</div>
				</div>

				<div class="title-photo-preview d-none"
					 id="titlePhotoPreview">
					<img src=""
						 alt="Титульное фото"
						 id="titlePhotoImage">
				</div>
			</div>

			<div class="passports-page-actions ops-page-actions">
				<a class="btn btn-outline-secondary"
				   href="/object-passports"
				   target="_self">
					← К списку
				</a>

				<button class="btn btn-primary"
						id="savePassportBtn"
						type="button">
					💾 Сохранить
				</button>
			</div>
		</div>

		<div class="alert d-none mb-4"
			 role="alert"
			 id="saveStatus">
		</div>

      <th:block th:replace="~{passports/fragments/editor-basic-info :: basicInfoCard}"></th:block>
      </div>

      <th:block th:replace="~{passports/fragments/editor-network :: networkCard}"></th:block>

      <div class="card passport-card mb-4 ops-section-card" id="scheduleCard">
        <div class="card-header d-flex justify-content-between align-items-center" data-section-header data-target="#scheduleBody">
          <span>Расписание</span>
          <button class="btn btn-sm btn-outline-secondary card-toggle-btn" type="button" data-section-toggle data-target="#scheduleBody" aria-expanded="false">Развернуть ▼</button>
        </div>
        <div class="section-collapse" id="scheduleBody">
          <div class="card-body">
          <div class="table-responsive passport-editor-table-shell">
			  <table class="table table-sm align-middle schedule-table passport-editor-table"
					 id="scheduleTable">
              <thead>
                <tr>
                  <th>День недели</th>
                  <th>С</th>
                  <th>По</th>
                  <th>24 часа</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="day : ${dayLabels}" th:attr="data-day=${day.key}">
                  <td th:text="${day.full}"></td>
                  <td><input type="time" class="form-control form-control-sm schedule-from" /></td>
                  <td><input type="time" class="form-control form-control-sm schedule-to" /></td>
                  <td>
                    <div class="form-check">
                      <input class="form-check-input schedule-24" type="checkbox" th:id="${'schedule24_' + day.key}" />
                      <label class="form-check-label" th:for="${'schedule24_' + day.key}">Круглосуточно</label>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
		  </div>
        </div>
      </div>

      <th:block th:replace="~{passports/fragments/editor-activity :: activityWorkspace}"></th:block>

      <th:block th:replace="~{passports/fragments/editor-media :: photosSection}"></th:block>

      <th:block th:replace="~{passports/fragments/editor-equipment :: equipmentSection}"></th:block>
    </div>
  </main>

  <th:block th:replace="~{passports/fragments/editor-media :: photoPreviewModal}"></th:block>

  <script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/edit-guard.js}"></script>
  <script id="passportData" type="application/json" th:utext="${passportPayloadJson}">{"is_new":true}</script>
  <script src="/js/passport-editor-equipment-runtime.js?v=20260916-01-260-p4j"></script>
  <script src="/js/passport-editor-page-runtime.js?v=20260916-01-260-p4k"></script>
  <script th:inline="javascript">
    const passportEditorPageRuntime = window.PassportEditorPageRuntime?.mount({
      parameterTypes: /*[[${parameterTypes}]]*/ {},
      parameterDependencies: /*[[${parameterDependencies}]]*/ {},
      parameterValuesPayload: /*[[${parameterValuesPayload}]]*/ {},
      statuses: /*[[${statuses}]]*/ [],
      statusesRequiringTask: /*[[${statusesRequiringTask}]]*/ [],
      dayLabels: /*[[${dayLabels}]]*/ [],
      networkProfiles: /*[[${networkProfiles}]]*/ [],
      itEquipmentOptions: /*[[${itEquipmentOptions}]]*/ {},
      itEquipmentCatalog: /*[[${itEquipmentCatalog}]]*/ [],
      itConnectionOptions: /*[[${itConnectionOptions}]]*/ [],
    });
    if (!passportEditorPageRuntime) {
      throw new Error('PassportEditorPageRuntime is unavailable');
    }
    passportEditorPageRuntime.boot();
  </script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/modal-transitions.js}"></script>
</body>
</html>
