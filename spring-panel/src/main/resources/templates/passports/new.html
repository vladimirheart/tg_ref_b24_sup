      <th:block th:replace="~{passports/fragments/editor-activity :: activityWorkspace}"></th:block>

  <script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/edit-guard.js}"></script>
  <script id="passportData" type="application/json" th:utext="${passportPayloadJson}">{"is_new":true}</script>
  <script src="/js/passport-editor-equipment-runtime.js?v=20260916-01-260-p4j"></script>
  <script th:inline="javascript">
    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupAutoExpandTextarea(textarea) {
      if (!textarea) return;
      const storedMinHeight = textarea.dataset.autoExpandMinHeight
        ? Number(textarea.dataset.autoExpandMinHeight)
        : null;
      const minHeight = storedMinHeight || Math.max(textarea.clientHeight || textarea.scrollHeight, 80);
      const adjustHeight = () => {
        const shouldExpand = (textarea.value || '').length > 50;
        textarea.style.height = shouldExpand ? 'auto' : `${minHeight}px`;
        if (shouldExpand) {
          textarea.style.height = `${Math.max(minHeight, textarea.scrollHeight)}px`;
        }
      };
      if (textarea.dataset.autoExpandInitialized !== 'true') {
        textarea.dataset.autoExpandInitialized = 'true';
        textarea.dataset.autoExpandMinHeight = String(minHeight);
        textarea.style.overflowY = 'hidden';
        textarea.addEventListener('input', adjustHeight);
        textarea.addEventListener('change', adjustHeight);
      }
      adjustHeight();
    }

    function initializeAutoExpandTextareas(root = document) {
      const scope = root instanceof Element ? root : document;
      scope.querySelectorAll('textarea.form-control.form-control-sm').forEach((textarea) => {
        if (textarea.dataset.noAutoExpand === 'true') return;
        setupAutoExpandTextarea(textarea);
      });
    }

    function setupAutoResizeInput(input) {
      if (!input) return;
      input.dataset.autoResizeInitialized = 'true';
      input.classList.add('auto-resize-input');
      input.style.width = '100%';
      input.style.maxWidth = '100%';
    }

    function initializeAutoResizeInputs(root = document) {
      const scope = root instanceof Element ? root : document;
      scope
        .querySelectorAll('input.form-control.form-control-sm[type="text"]')
        .forEach((input) => {
          if (input.dataset.noAutoResize === 'true') return;
          const context = input.closest('.passport-card, .equipment-card');
          if (!context) return;
          if (input.closest('.dropdown-menu')) return;
          setupAutoResizeInput(input);
        });
    }

    const PARAMETER_TITLES = /*[[${parameterTypes}]]*/ {};
    const PARAMETER_DEPENDENCIES = /*[[${parameterDependencies}]]*/ {};
    const parameterValuesInitial = /*[[${parameterValuesPayload}]]*/ {};
    const statuses = /*[[${statuses}]]*/ [];
    const statusesRequiringTask = new Set(/*[[${statusesRequiringTask}]]*/ []);
    const dayLabels = /*[[${dayLabels}]]*/ [];
    const networkProfilesRaw = /*[[${networkProfiles}]]*/ [];
    const networkProfiles = Array.isArray(networkProfilesRaw) ? networkProfilesRaw : [];
    const equipmentOptionSetsRaw = /*[[${itEquipmentOptions}]]*/ {};
    const equipmentOptionSets = {
      types: Array.isArray(equipmentOptionSetsRaw && equipmentOptionSetsRaw.types)
        ? equipmentOptionSetsRaw.types
        : [],
      vendors: Array.isArray(equipmentOptionSetsRaw && equipmentOptionSetsRaw.vendors)
        ? equipmentOptionSetsRaw.vendors
        : [],
      models: Array.isArray(equipmentOptionSetsRaw && equipmentOptionSetsRaw.models)
        ? equipmentOptionSetsRaw.models
        : [],
      serials: Array.isArray(equipmentOptionSetsRaw && equipmentOptionSetsRaw.serials)
        ? equipmentOptionSetsRaw.serials
        : [],
      statuses: Array.isArray(equipmentOptionSetsRaw && equipmentOptionSetsRaw.statuses)
        ? equipmentOptionSetsRaw.statuses
        : [],
    };
    const itEquipmentCatalogRaw = /*[[${itEquipmentCatalog}]]*/ [];
    const equipmentCatalog = Array.isArray(itEquipmentCatalogRaw)
      ? itEquipmentCatalogRaw
          .filter((item) => item && typeof item === 'object')
          .map((item) => ({
            equipment_type: normalizeCatalogValue(item.equipment_type),
            equipment_vendor: normalizeCatalogValue(item.equipment_vendor),
            equipment_model: normalizeCatalogValue(item.equipment_model),
            serial_number: normalizeCatalogValue(item.serial_number),
            accessories: typeof item.accessories === 'string' ? item.accessories.trim() : '',
            photo_url: typeof item.photo_url === 'string' ? item.photo_url.trim() : '',
          }))
      : [];
    equipmentCatalog.forEach((item) => {
      addUniqueOption(equipmentOptionSets.types, item.equipment_type);
      addUniqueOption(equipmentOptionSets.vendors, item.equipment_vendor);
      addUniqueOption(equipmentOptionSets.models, item.equipment_model);
      addUniqueOption(equipmentOptionSets.serials, item.serial_number);
    });
    const itConnectionChoicesRaw = /*[[${itConnectionOptions}]]*/ [];
    const itConnectionChoices = Array.isArray(itConnectionChoicesRaw) ? itConnectionChoicesRaw : [];

    const passportIdFromUrlMatch = window.location.pathname.match(/object-passports\/(\d+)/);
    const passportIdFromUrl = passportIdFromUrlMatch ? Number(passportIdFromUrlMatch[1]) : null;
    const hasValidPassportIdInUrl = Number.isFinite(passportIdFromUrl) && passportIdFromUrl > 0;
    const passportDataElement = document.getElementById('passportData');
    let initialPassportParseFailed = false;
    let passportDataRaw = passportDataElement ? passportDataElement.textContent : '';
    if (!passportDataRaw || !passportDataRaw.trim()) {
      passportDataRaw = '{}';
      if (hasValidPassportIdInUrl) {
        initialPassportParseFailed = true;
      }
    }
    let passportData = {};
    try {
      passportData = JSON.parse(passportDataRaw);
    } catch (error) {
      console.error('Failed to parse initial passport payload:', error);
      initialPassportParseFailed = true;
      passportData = {};
    }
    if (!passportData || typeof passportData !== 'object') {
      passportData = {};
    }
    if (hasValidPassportIdInUrl) {
      if (!passportData.id) {
        passportData.id = passportIdFromUrl;
      }
      passportData.is_new = false;
    } else if (typeof passportData.is_new !== 'boolean') {
      passportData.is_new = true;
    }

    let parameterItemsByType = (typeof structuredClone === 'function')
      ? structuredClone(parameterValuesInitial)
      : JSON.parse(JSON.stringify(parameterValuesInitial));
    const parameterKeys = Object.keys(parameterValuesInitial || {});
    let parameterValues = {};
      const BUSINESS_NAME_ALIASES = Object.freeze({
        'СушиВесла': 'СушиВёсла',
        'SV-Povolzhye': 'СушиВёсла',
        'SV-Ulyanovsk': 'СушиВёсла',
        'SV-Kursk': 'СушиВёсла',
        'OOO SV Joshkar-Ola': 'СушиВёсла',
        'BlinBerri': 'БлинБери',
        'BB Joshkor Ola': 'БлинБери',
      });

    function normalizeBusinessName(value) {
      const normalized = normalizeCatalogValue(value);
      return BUSINESS_NAME_ALIASES[normalized] || normalized;
    }

    function normalizeLocationDependencyValue(key, value) {
      const normalizedKey = normalizeCatalogValue(key);
      if (normalizedKey === 'business') {
        return normalizeBusinessName(value);
      }
      return normalizeCatalogValue(value);
    }

    function normalizeParameterDependencies(raw) {
      const result = {};
      if (!raw || typeof raw !== 'object') {
        return result;
      }
      Object.entries(raw).forEach(([key, value]) => {
        const normalizedKey = normalizeCatalogValue(key);
        const normalizedValue = normalizeLocationDependencyValue(normalizedKey, value);
        if (normalizedKey && normalizedValue) {
          result[normalizedKey] = normalizedValue;
        }
      });
      return result;
    }

    function normalizeParameterCatalog(source) {
      const data = source && typeof source === 'object' ? source : {};
      const result = {};
      parameterKeys.forEach((key) => {
        const items = Array.isArray(data[key]) ? data[key] : [];
        result[key] = items
          .filter((item) => item && typeof item === 'object')
          .map((item) => ({
            id: item.id ?? null,
            value: key === 'business'
              ? normalizeBusinessName(item.value)
              : normalizeCatalogValue(item.value),
            is_deleted: Boolean(item.is_deleted),
            dependencies: normalizeParameterDependencies(item.dependencies),
            extra: item.extra && typeof item.extra === 'object' ? item.extra : {},
          }))
          .filter((item) => item.value);
      });
      return result;
    }

    function extractParameterValueLists(source) {
      const result = {};
      parameterKeys.forEach((key) => {
        const items = Array.isArray(source[key]) ? source[key] : [];
        const values = items
          .filter((item) => item && !item.is_deleted && item.value)
          .map((item) => item.value);
        result[key] = Array.from(new Set(values));
      });
      return result;
    }

    function getCurrentLocationSelections() {
      return {
        country: normalizeLocationDependencyValue('country', countrySelect ? countrySelect.value : ''),
        partner_type: normalizeLocationDependencyValue('partner_type', partnerTypeSelect ? partnerTypeSelect.value : ''),
        business: normalizeLocationDependencyValue('business', businessSelect ? businessSelect.value : ''),
        city: normalizeLocationDependencyValue('city', cityInput ? cityInput.value : ''),
      };
    }

    function itemMatchesSelections(item, selections, dependencyKeys) {
      if (!item || item.is_deleted) return false;
      const deps = item.dependencies && typeof item.dependencies === 'object' ? item.dependencies : {};
      const keys = Array.isArray(dependencyKeys) ? dependencyKeys : [];
      return keys.every((depKey) => {
        const selectedValue = normalizeLocationDependencyValue(depKey, selections[depKey]);
        if (!selectedValue) {
          return true;
        }
        const candidateValue = normalizeLocationDependencyValue(depKey, deps[depKey]);
        if (!candidateValue) {
          return true;
        }
        return candidateValue === selectedValue;
      });
    }

    function collectDerivedBusinessValues(selections) {
      const selectedCountry = normalizeCatalogValue(selections.country);
      const selectedPartnerType = normalizeCatalogValue(selections.partner_type);
      if (!selectedCountry && !selectedPartnerType) {
        return [];
      }
      const derived = new Set();
      ['city', 'department'].forEach((key) => {
        const items = Array.isArray(parameterItemsByType[key]) ? parameterItemsByType[key] : [];
        items.forEach((item) => {
          if (!itemMatchesSelections(item, selections, ['country', 'partner_type', 'city'])) {
            return;
          }
          const businessValue = normalizeLocationDependencyValue('business', item.dependencies && item.dependencies.business);
          if (businessValue) {
            derived.add(businessValue);
          }
        });
      });
      return Array.from(derived);
    }

    function findDepartmentCatalogMatches({ departmentValue, businessValue, partnerTypeValue = '', countryValue = '' }) {
      const selectedDepartment = normalizeCatalogValue(departmentValue);
      const selectedBusiness = normalizeLocationDependencyValue('business', businessValue);
      const selectedPartnerType = normalizeLocationDependencyValue('partner_type', partnerTypeValue);
      const selectedCountry = normalizeLocationDependencyValue('country', countryValue);
      if (!selectedDepartment || !selectedBusiness) {
        return [];
      }
      const items = Array.isArray(parameterItemsByType.department) ? parameterItemsByType.department : [];
      return items.filter((item) => {
        if (!item || item.is_deleted) return false;
        if (normalizeCatalogValue(item.value) !== selectedDepartment) return false;
        const dependencies = item.dependencies && typeof item.dependencies === 'object' ? item.dependencies : {};
        const candidateBusiness = normalizeLocationDependencyValue('business', dependencies.business);
        if (candidateBusiness && candidateBusiness !== selectedBusiness) return false;
        const candidatePartnerType = normalizeLocationDependencyValue('partner_type', dependencies.partner_type);
        if (selectedPartnerType && candidatePartnerType && candidatePartnerType !== selectedPartnerType) return false;
        const candidateCountry = normalizeLocationDependencyValue('country', dependencies.country);
        if (selectedCountry && candidateCountry && candidateCountry !== selectedCountry) return false;
        return true;
      });
    }

    function applyDepartmentSelectionContext() {
      if (!departmentSelect || !businessSelect) return;
      const departmentValue = normalizeCatalogValue(departmentSelect.value);
      const businessValue = normalizeCatalogValue(businessSelect.value);
      if (!departmentValue || !businessValue) return;
      const matches = findDepartmentCatalogMatches({
        departmentValue,
        businessValue,
        partnerTypeValue: partnerTypeSelect ? partnerTypeSelect.value : '',
        countryValue: countrySelect ? countrySelect.value : '',
      });
      if (!matches.length) return;

      const collectDependencyValues = (key) => Array.from(new Set(matches
        .map((item) => normalizeLocationDependencyValue(key, item.dependencies && item.dependencies[key]))
        .filter(Boolean)));

      const partnerTypes = collectDependencyValues('partner_type');
      const countries = collectDependencyValues('country');
      const cities = collectDependencyValues('city');
      let changed = false;

      if (countrySelect && !normalizeCatalogValue(countrySelect.value) && countries.length === 1) {
        ensureSelectHasOption(countrySelect, countries[0]);
        countrySelect.value = countries[0];
        refreshSearchableSelect(countrySelect);
        changed = true;
      }
      if (partnerTypeSelect && !normalizeCatalogValue(partnerTypeSelect.value) && partnerTypes.length === 1) {
        ensureSelectHasOption(partnerTypeSelect, partnerTypes[0]);
        partnerTypeSelect.value = partnerTypes[0];
        refreshSearchableSelect(partnerTypeSelect);
        changed = true;
      }
      if (cityInput) {
        const currentCity = normalizeCatalogValue(cityInput.value);
        const currentCityIsMatched = currentCity && cities.includes(currentCity);
        if ((!currentCity || !currentCityIsMatched) && cities.length === 1) {
          cityInput.value = cities[0];
          changed = true;
        }
      }

      if (changed) {
        refreshLocationParameterOptions({ preserveCurrent: true });
      }
    }

    function getFilteredParameterValues(key, { preserveCurrent = false } = {}) {
      const items = Array.isArray(parameterItemsByType[key]) ? parameterItemsByType[key] : [];
      const selections = getCurrentLocationSelections();
      const currentValue = normalizeCatalogValue(
        key === 'city'
          ? (cityInput ? cityInput.value : '')
          : (document.getElementById(`${key === 'partner_type' ? 'partnerType' : key === 'legal_entity' ? 'legalEntity' : key}Select`) || {}).value,
      );
      let values = [];
      if (key === 'business') {
        const derived = collectDerivedBusinessValues(selections);
        values = derived.length
          ? derived
          : (parameterValues[key] || []);
      } else {
        if (key === 'department' && !selections.business) {
          values = preserveCurrent && currentValue
            ? [currentValue]
            : [];
        } else {
          const dependencyKeys = key === 'department'
            ? (selections.partner_type
              ? ['country', 'partner_type', 'business']
              : ['country', 'business'])
            : (Array.isArray(PARAMETER_DEPENDENCIES[key]) ? PARAMETER_DEPENDENCIES[key] : []);
          values = items
            .filter((item) => itemMatchesSelections(item, selections, dependencyKeys))
            .map((item) => item.value);
          if (key === 'city' && !values.length) {
            values = items
              .filter((item) => itemMatchesSelections(item, selections, ['country', 'partner_type']))
              .map((item) => item.value);
          }
          if (key === 'city' && !values.length) {
            values = items.map((item) => item.value);
          }
          if (key === 'department' && !values.length && preserveCurrent) {
            values = currentValue
              ? [currentValue]
              : [];
          }
        }
      }
      const unique = Array.from(new Set(values.filter(Boolean)));
      if (preserveCurrent && currentValue && !unique.includes(currentValue)) {
        unique.push(currentValue);
      }
      return unique.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    parameterItemsByType = normalizeParameterCatalog(parameterItemsByType);
    parameterValues = extractParameterValueLists(parameterItemsByType);

    function buildSelectOptions(values, currentValue) {
      const list = Array.isArray(values) ? values.filter(Boolean) : [];
      const normalizedCurrent = (currentValue || '').trim();
      const unique = [];
      list.forEach((item) => {
        const value = typeof item === 'string' ? item.trim() : '';
        if (value && !unique.includes(value)) {
          unique.push(value);
        }
      });
      if (normalizedCurrent && !unique.includes(normalizedCurrent)) {
        unique.push(normalizedCurrent);
      }
      const options = ['<option value="">Не выбрано</option>'];
      unique.forEach((item) => {
        const escaped = escapeHtml(item);
        const selected = item === normalizedCurrent ? ' selected' : '';
        options.push(`<option value="${escaped}"${selected}>${escaped}</option>`);
      });
      return options.join('');
    }

    function normalizeCatalogValue(value) {
      return typeof value === 'string' ? value.trim() : '';
    }

    function addUniqueOption(list, value) {
      if (!Array.isArray(list)) return;
      const normalized = normalizeCatalogValue(value);
      if (!normalized || list.includes(normalized)) return;
      list.push(normalized);
    }

    function buildDatalistOptions(values, currentValue) {
      const list = Array.isArray(values) ? values.filter(Boolean) : [];
      const normalizedCurrent = normalizeCatalogValue(currentValue || '');
      const unique = [];
      list.forEach((item) => {
        const normalized = normalizeCatalogValue(item);
        if (normalized && !unique.includes(normalized)) {
          unique.push(normalized);
        }
      });
      if (normalizedCurrent && !unique.includes(normalizedCurrent)) {
        unique.push(normalizedCurrent);
      }
      return unique.map((item) => `<option value="${escapeHtml(item)}"></option>`).join('');
    }

    const departmentSelect = document.getElementById('departmentSelect');
    const businessSelect = document.getElementById('businessSelect');
    const partnerTypeSelect = document.getElementById('partnerTypeSelect');
    const countrySelect = document.getElementById('countrySelect');
    const legalEntitySelect = document.getElementById('legalEntitySelect');
    const cityInput = document.getElementById('cityInput');
    const citiesList = document.getElementById('citiesList');
    const locationAddressInput = document.getElementById('locationAddressInput');
    const statusSelect = document.getElementById('statusSelect');
    const internalNetworkInput = document.getElementById('internalNetworkInput');
    const networkTunnelInput = document.getElementById('networkTunnelInput');
    const networkProviderInput = document.getElementById('networkProviderInput');
    const networkContractInput = document.getElementById('networkContractInput');
    const networkRestaurantIdInput = document.getElementById('networkRestaurantIdInput');
    const networkRestaurantOptionsList = document.getElementById('networkRestaurantOptions');
    const defaultNetworkRestaurantOptionValues = (() => {
      if (!networkRestaurantOptionsList) {
        return [];
      }
      const seen = new Set();
      const values = [];
      networkRestaurantOptionsList.querySelectorAll('option').forEach((option) => {
        const value = (option && option.value != null ? String(option.value) : '').trim();
        if (value && !seen.has(value)) {
          seen.add(value);
          values.push(value);
        }
      });
      return values;
    })();
    let currentNetworkRestaurantOptionsSignature = defaultNetworkRestaurantOptionValues.join('|');
    const networkLegalEntityInput = document.getElementById('networkLegalEntityInput');
    const networkSupportPhoneInput = document.getElementById('networkSupportPhoneInput');
    const networkSpeedInput = document.getElementById('networkSpeedInput');
    const networkParamsInput = document.getElementById('networkParamsInput');
    const networkEquipmentSummary = document.getElementById('networkEquipmentSummary');
    const itBlock = document.getElementById('itBlock');
    const toggleItBlockBtn = document.getElementById('toggleItBlockBtn');
    const itEquipmentList = document.getElementById('itEquipmentList');

    function registerSearchableSelect(wrapper) {
      if (!wrapper) return;
      const selectId = wrapper.dataset.selectId;
      if (!selectId) return;
      const select = document.getElementById(selectId);
      if (!select) return;

      const dropdownToggle = wrapper.querySelector('[data-bs-toggle="dropdown"]');
      const labelEl = wrapper.querySelector('.searchable-select-label');
      const searchInput = wrapper.querySelector('.searchable-select-search');
      const optionsContainer = wrapper.querySelector('.searchable-select-options');
      const dropdownMenu = wrapper.querySelector('.dropdown-menu');
      if (!dropdownToggle || !labelEl || !searchInput || !optionsContainer || !dropdownMenu) return;

      const shouldUseBootstrapDropdown =
        typeof bootstrap !== 'undefined' && !wrapper.hasAttribute('data-force-custom-dropdown');

      if (!shouldUseBootstrapDropdown) {
        dropdownToggle.removeAttribute('data-bs-toggle');
        dropdownToggle.removeAttribute('data-bs-auto-close');
      }

      const dropdownInstance = shouldUseBootstrapDropdown
        ? bootstrap.Dropdown.getOrCreateInstance(dropdownToggle, { autoClose: false })
        : null;

      const showMenu = () => {
        if (dropdownInstance) {
          dropdownInstance.show();
          return;
        }
        wrapper.classList.add('show');
        dropdownMenu.classList.add('show');
        dropdownMenu.style.display = 'block';
        dropdownToggle.setAttribute('aria-expanded', 'true');
      };

      const hideMenu = () => {
        if (dropdownInstance) {
          dropdownInstance.hide();
          return;
        }
        wrapper.classList.remove('show');
        dropdownMenu.classList.remove('show');
        dropdownMenu.style.display = '';
        dropdownToggle.setAttribute('aria-expanded', 'false');
      };

      const handleDropdownShown = () => {
        searchInput.value = '';
        filterOptions('');
        setTimeout(() => searchInput.focus(), 50);
      };

      const handleDropdownHidden = () => {
        searchInput.value = '';
        filterOptions('');
      };

      const isMenuShown = () =>
        dropdownInstance
          ? dropdownToggle.getAttribute('aria-expanded') === 'true'
          : dropdownMenu.classList.contains('show');

      function buildOptions() {
        optionsContainer.innerHTML = '';
        Array.from(select.options).forEach((option) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'dropdown-item text-start';
          item.dataset.value = option.value;
          item.dataset.label = option.text;
          item.textContent = option.text || '—';
          if (option.selected) {
            item.classList.add('active');
          }
          optionsContainer.appendChild(item);
        });
      }

      function updateLabel() {
        const option = select.options[select.selectedIndex];
        labelEl.textContent = option ? option.text : 'Не выбрано';
      }

      function filterOptions(value) {
        const normalized = (value || '').trim().toLowerCase();
        optionsContainer.querySelectorAll('.dropdown-item').forEach((item) => {
          const label = (item.dataset.label || item.textContent || '').toLowerCase();
          item.classList.toggle('d-none', Boolean(normalized) && !label.includes(normalized));
        });
      }

      optionsContainer.addEventListener('click', (event) => {
        const button = event.target.closest('.dropdown-item');
        if (!button) return;
        const value = button.dataset.value || '';
        if (select.value !== value) {
          select.value = value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        } else {
          select.dispatchEvent(new Event('change', { bubbles: true }));
        }
        updateLabel();
        optionsContainer.querySelectorAll('.dropdown-item').forEach((item) => {
          item.classList.toggle('active', item === button);
        });
        hideMenu();
        handleDropdownHidden();
      });

      searchInput.addEventListener('input', () => filterOptions(searchInput.value));

      const refreshState = () => {
        buildOptions();
        updateLabel();
        filterOptions(searchInput.value);
      };

      const state = {
        refresh: refreshState,
        select,
        labelEl,
        hide: () => {
          if (!isMenuShown()) return;
          hideMenu();
          if (!dropdownInstance) {
            handleDropdownHidden();
          }
        },
        isShown: isMenuShown,
      };

      searchableSelectRegistry.set(selectId, state);

      if (dropdownInstance) {
        wrapper.addEventListener('show.bs.dropdown', () => closeOtherSearchableSelects(selectId));
        wrapper.addEventListener('shown.bs.dropdown', handleDropdownShown);
        wrapper.addEventListener('hidden.bs.dropdown', handleDropdownHidden);
      } else {
        dropdownToggle.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (isMenuShown()) {
            state.hide();
          } else {
            closeOtherSearchableSelects(selectId);
            showMenu();
            handleDropdownShown();
          }
        });

        document.addEventListener('click', (event) => {
          if (!wrapper.contains(event.target)) {
            state.hide();
          }
        });
      }

      state.refresh();

      select.addEventListener('change', () => {
        updateLabel();
        optionsContainer.querySelectorAll('.dropdown-item').forEach((item) => {
          item.classList.toggle('active', item.dataset.value === select.value);
        });
      });
    }

    function formatNetworkSpeedValue(value) {
      const raw = (value || '').trim();
      if (!raw) return '';

      const normalized = raw.replace(/\s+/g, ' ');
      const numericFrom = (source) => {
        const cleaned = source.replace(/[\s,]/g, (match) => (match === ',' ? '.' : ''));
        const numeric = cleaned.replace(/[^0-9.]/g, '');
        return /^\d+(?:\.\d+)?$/.test(numeric) ? numeric : '';
      };

      const ensureSuffix = (base) => {
        const trimmed = base.trim();
        const numeric = numericFrom(trimmed);
        return `${numeric || trimmed} Мбит/с`.trim();
      };

      if (/мбит\s*\/\s*с$/i.test(normalized)) {
        const base = normalized.replace(/мбит\s*\/\s*с$/i, '');
        return ensureSuffix(base);
      }

      if (/бит\s*\/\s*с$/i.test(normalized)) {
        const base = normalized.replace(/бит\s*\/\s*с$/i, '');
        return ensureSuffix(base);
      }

      const numeric = numericFrom(normalized);
      if (numeric) {
        return `${numeric} Мбит/с`;
      }
      return normalized;
    }

    function isRostelecomProviderName(name) {
      if (!name) return false;

      if (upper.includes('РОСТЕЛЕКОМ')) {
        return true;
      }
      if (/(?:^|[^A-ZА-Я0-9])РТ/.test(upper)) {
        return true;

      if (/(?:^|[^A-ZА-Я0-9])RT/.test(upper)) {

      return false;
    }

    const rostelecomRestaurantIdOptionsByProvider = (() => {
      const map = new Map();
      const pushValue = (targetSet, raw) => {
        const value = raw == null ? '' : String(raw).trim();
        if (!value) return;
        targetSet.add(value);
      };
      networkProfiles.forEach((profile) => {
        if (!profile || !isRostelecomProviderName(profile.provider)) {
          return;
        }
        const key = normalizeNetworkProfileValue(profile.provider);
        if (!key) return;
        const set = map.get(key) || new Set();
        if (Array.isArray(profile.restaurant_ids)) {
          profile.restaurant_ids.forEach((item) => pushValue(set, item));
        }
        pushValue(set, profile.restaurant_id);
        if (set.size) {
          map.set(key, set);
        }
      });
      return map;
    })();

    function rebuildNetworkRestaurantIdDatalist(values) {
      if (!networkRestaurantOptionsList) {
        return;
      }
      const unique = [];
      const seen = new Set();
      (values || []).forEach((raw) => {
        const value = raw == null ? '' : String(raw).trim();
        if (!value || seen.has(value)) return;
        seen.add(value);
        unique.push(value);
      });
      const signature = unique.join('|');
      if (signature === currentNetworkRestaurantOptionsSignature) {
        return;
      }
      currentNetworkRestaurantOptionsSignature = signature;
      networkRestaurantOptionsList.innerHTML = '';
      unique.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        networkRestaurantOptionsList.appendChild(option);
      });
    }

    function updateNetworkRestaurantIdOptionsForProvider(providerValue) {
      if (!networkRestaurantOptionsList) {
        return;
      }
      const providerKey = normalizeNetworkProfileValue(providerValue);
      const providerOptions = providerKey
        ? rostelecomRestaurantIdOptionsByProvider.get(providerKey)
        : null;
      if (providerOptions && providerOptions.size) {
        const combined = Array.from(providerOptions).concat(defaultNetworkRestaurantOptionValues);
        rebuildNetworkRestaurantIdDatalist(combined);
      } else {
        rebuildNetworkRestaurantIdDatalist(defaultNetworkRestaurantOptionValues);
      }
    }

    let suppressNetworkProfileSync = false;

    function findNetworkProfileByField(field, value) {
      const normalized = normalizeNetworkProfileValue(value);
      if (!normalized) return null;
      return (
        networkProfiles.find((profile) => {
          if (!profile) return false;
          if (field === 'restaurant_id') {
            const candidates = [];
            if (Array.isArray(profile.restaurant_ids)) {
              profile.restaurant_ids.forEach((entry) => {
                const trimmed = normalizeNetworkProfileValue(entry);
                if (trimmed) {
                  candidates.push(trimmed);
                }
              });
            }
            const fallback = normalizeNetworkProfileValue(profile.restaurant_id);
            if (fallback) {
              candidates.push(fallback);
            }
            return candidates.includes(normalized);
          }
          const candidate = profile[field];
          return normalizeNetworkProfileValue(candidate) === normalized;
        }) || null
      );
    }

    function fillNetworkProfileFields(profile, overrides) {
      if (!profile) return;
      suppressNetworkProfileSync = true;
      Object.entries(networkProfileFieldMapping).forEach(([key, input]) => {
        if (!input) return;
        if (key === 'restaurant_id') {
          const ids = Array.isArray(profile.restaurant_ids) ? profile.restaurant_ids.filter((id) => id) : [];
          const overrideValue = overrides && Object.prototype.hasOwnProperty.call(overrides, key) ? overrides[key] : undefined;
          const value = overrideValue != null
            ? overrideValue
            : ids.length
              ? ids[0]
              : profile[key] || '';
          input.value = value || '';
        } else {
          const overrideValue = overrides && Object.prototype.hasOwnProperty.call(overrides, key) ? overrides[key] : undefined;
          input.value = overrideValue != null ? overrideValue : profile[key] || '';
        }
        setupAutoResizeInput(input);
      });
      updateNetworkRestaurantIdOptionsForProvider(networkProviderInput ? networkProviderInput.value : profile.provider);
      suppressNetworkProfileSync = false;
    }

    function handleNetworkProfileSelection(field, value) {
      if (suppressNetworkProfileSync) return;
      const profile = findNetworkProfileByField(field, value);
      if (profile) {
        const overrides = {};
        if (field === 'restaurant_id') {
          overrides.restaurant_id = typeof value === 'string' ? value.trim() : value;
        }
        fillNetworkProfileFields(profile, overrides);
        return;
      }
      updateNetworkRestaurantIdOptionsForProvider(networkProviderInput ? networkProviderInput.value : '');
    }

    function populateSchedule(schedule) {
      const mapping = {};
      (schedule || []).forEach((entry) => {

    async function savePassport() {
      const payload = collectFormData();
      if (!payload.department) {
        showSaveMessage('error', 'Поле «Департамент» обязательно для заполнения.');
      return false;
      }
      if (statusesRequiringTask.has(payload.status) && !payload.status_task_id) {
        showSaveMessage('error', 'Для выбранного статуса необходимо выбрать задачу.');
      return false;
      }
      const isNew = Boolean(passportData.is_new);
      const url = isNew ? '/api/object_passports' : `/api/object_passports/${passportData.id}`;
      const method = isNew ? 'POST' : 'PUT';
      savePassportBtn.disabled = true;
      savePassportBtn.innerText = 'Сохранение...';
      let saved = false;
      try {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || 'Не удалось сохранить паспорт');
        }
        if (isNew && data.id) {
          markPassportSavedState();
          window.location.href = `/object-passports/${data.id}`;
          return true;
        }
        passportData = data.passport || passportData;
        passportData.is_new = false;
        populateForm();
        if (payload.resume_date) {
          resumeDateInput.value = '';
          passportData.resume_date = '';
        }
        showSaveMessage('success', 'Изменения сохранены.');
        saved = true;
        markPassportSavedState();
      } catch (error) {
        console.error(error);
        showSaveMessage('error', error.message || 'Произошла ошибка при сохранении.');
        return false;
      } finally {
        savePassportBtn.disabled = false;
        savePassportBtn.innerText = '💾 Сохранить';
      }
      return saved;
    }

    async function addParameter(paramType, selectId) {
      const select = document.getElementById(selectId);
      if (!select) return;
      const value = prompt('Введите новое значение:');
      if (!value || !value.trim()) return;
      try {
        const payload = { param_type: paramType, value: value.trim() };
        const dependencies = Array.isArray(PARAMETER_DEPENDENCIES[paramType])
          ? PARAMETER_DEPENDENCIES[paramType]
          : [];
        for (const dep of dependencies) {
          const label = PARAMETER_TITLES[dep] || dep;
          const suggestions = Array.isArray(parameterValues[dep]) ? parameterValues[dep] : [];
          const hint = suggestions.length ? ` (например: ${suggestions.slice(0, 5).join(', ')})` : '';
          const input = window.prompt(`Укажите значение для «${label}»${hint}:`);
          if (input === null) {
            return;
          }
          const trimmed = typeof input === 'string' ? input.trim() : '';
          if (!trimmed) {
            showPopup(`Поле «${label}» обязательно`);
            return;
          }
          payload[dep] = trimmed;
        }
        const response = await fetch('/api/settings/parameters', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || 'Не удалось добавить значение');
        }
        parameterItemsByType = normalizeParameterCatalog((data && data.data) || parameterItemsByType);
        parameterValues = extractParameterValueLists(parameterItemsByType);
        updateSelectOptions();
        select.value = value.trim();
        refreshSearchableSelect(select);
        if (select === businessSelect || select === departmentSelect) {
          updateObjectTitle();
        }
        showSaveMessage('success', 'Значение успешно добавлено.');
      } catch (error) {
        console.error(error);
        showSaveMessage('error', error.message || 'Ошибка при добавлении значения.');
      }
    }

    function renderStatusTaskOptions(tasks) {
      if (!statusTaskSelect) return;

      const options = ['<option value="">Не выбрано</option>'];
      list.forEach((task) => {
        const descriptor = [task.display_no || (task.id != null ? String(task.id) : ''), task.title || '']
          .filter(Boolean)
          .join(' · ');
        options.push(`<option value="${task.id}">${escapeHtml(descriptor || String(task.id || ''))}</option>`);
      });
      if (passportData.status_task && passportData.status_task.id && !list.some((task) => String(task.id) === String(passportData.status_task.id))) {
        const descriptor = [passportData.status_task.display_no || String(passportData.status_task.id), passportData.status_task.title || '']
          .filter(Boolean)
          .join(' · ');
        options.push(`<option value="${passportData.status_task.id}">${escapeHtml(descriptor)}</option>`);
      }
      statusTaskSelect.innerHTML = options.join('');

        statusTaskSelect.value = preservedValue;

    function updateStatusTaskRequirement() {
      if (!statusTaskContainer || !statusTaskSelect) return;
      const requiresTask = statusesRequiringTask.has(statusSelect.value);
      statusTaskContainer.classList.toggle('d-none', !requiresTask);
      if (statusTaskHint) {
        statusTaskHint.textContent = passportData.is_new
          ? 'Сохраните паспорт, чтобы выбрать задачу.'
          : 'Выберите задачу, отражающую текущее состояние объекта.';
      }
      if (requiresTask) {
        if (!Array.isArray(passportData.tasks) || !passportData.tasks.length) {
          if (!passportData.is_new) {
            refreshTasks();
          }
        } else {
          renderStatusTaskOptions(passportData.tasks);
        }
      } else if (statusTaskInfo) {
        statusTaskInfo.textContent = '';
      }
    }

    function updateStatusTaskInfo() {
      if (!statusTaskInfo || !statusTaskSelect) return;
      const selectedValue = statusTaskSelect.value;
      if (!selectedValue) {
        statusTaskInfo.textContent = '';
        return;
      }
      let task = (passportData.tasks || []).find((item) => String(item.id) === selectedValue);
      if (!task && passportData.status_task && String(passportData.status_task.id) === selectedValue) {
        task = passportData.status_task;
      }
      if (!task) {
        statusTaskInfo.textContent = '';
        return;
      }
      const parts = [];
      if (task.status) parts.push(`Статус: ${task.status}`);
      if (task.assignee) parts.push(`Исполнитель: ${task.assignee}`);
      if (task.due_at_display || task.due_at) parts.push(`Дедлайн: ${task.due_at_display || task.due_at}`);
      if (task.last_activity_display || task.last_activity) parts.push(`Обновлено: ${task.last_activity_display || task.last_activity}`);
      statusTaskInfo.textContent = parts.join(' · ');
    }

        const bIsTitle = ((b && b.category) || '').toLowerCase() === 'title';
        if (aIsTitle === bIsTitle) return 0;
        return aIsTitle ? -1 : 1;
      });
      passportData.photos = sorted;
      photosContainer.innerHTML = '';
      updateTitlePhotoPreview(sorted);
      if (!sorted.length) {
        photosEmptyText.classList.remove('d-none');
        return;
      }
      photosEmptyText.classList.add('d-none');
      sorted.forEach((photo) => {
        const col = document.createElement('div');
        col.className = 'col-md-4';
        const captionRaw = photo.caption || '';
        const captionHtml = escapeHtml(captionRaw).replace(/\n/g, '<br>');
        const categoryValue = ((photo && photo.category) || '').toLowerCase();
        const isTitleCategory = categoryValue === 'title';
        const categoryLabel = isTitleCategory ? 'Титульное' : 'Архивное';
        col.innerHTML = `
          <div class="card h-100 photo-card ops-section-card" data-id="${photo.id != null ? photo.id : ''}">
            <div class="position-relative">
              ${isTitleCategory ? '<span class="title-indicator">✔</span>' : ''}
              <div class="dropdown photo-toolbar">
				  <button class="btn btn-sm btn-outline-secondary passport-photo-menu-toggle"
						  type="button"
						  data-bs-toggle="dropdown"
						  aria-expanded="false">
					⋮
				  </button>

				  <ul class="dropdown-menu dropdown-menu-end passport-photo-menu">
                  <li><a class="dropdown-item" href="#" data-action="toggle-photo-edit">Редактировать</a></li>
                  <li><a class="dropdown-item" href="${escapeHtml(photo.url)}" download>Скачать</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item text-danger" href="#" data-action="delete-photo">Удалить</a></li>
                </ul>
              </div>
              <img src="${escapeHtml(photo.url)}" class="card-img-top passport-photo" alt="Фото" data-photo-id="${photo.id != null ? photo.id : ''}" />
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge passport-photo-category-badge"
					  data-photo-category="${isTitleCategory ? 'title' : 'archive'}">
				  ${categoryLabel}
				</span>
              </div>
              <div class="photo-caption-text">${captionHtml || '—'}</div>
              <form class="photo-edit-form mt-3 d-none">
                <div class="mb-2">
                  <label class="form-label">Подпись</label>
                  <input type="text" class="form-control form-control-sm photo-caption" value="${escapeHtml(photo.caption || '')}" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Тип</label>
                  <select class="form-select form-select-sm photo-category">
                    <option value="title" ${isTitleCategory ? 'selected' : ''}>Титульное</option>
                    <option value="archive" ${isTitleCategory ? '' : 'selected'}>Архивное</option>
                  </select>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-sm btn-primary" type="button" data-action="save-photo">Сохранить</button>
                  <button class="btn btn-sm btn-outline-secondary" type="button" data-action="cancel-photo-edit">Отмена</button>
                </div>
              </form>
            </div>
          </div>
        `;
        photosContainer.appendChild(col);
      });
      if (photosContainer) {
        initializeAutoResizeInputs(photosContainer);
      }
    }

    function updatePhotoPreviewMeta(activeIndex) {
      if (!Array.isArray(currentPhotoPreviewList) || !currentPhotoPreviewList.length) return;
      const index = typeof activeIndex === 'number' ? activeIndex : 0;
      const boundedIndex = Math.max(0, Math.min(index, currentPhotoPreviewList.length - 1));
      const photo = currentPhotoPreviewList[boundedIndex];
      if (!photo) return;
      const captionHtml = escapeHtml(photo.caption || '').replace(/\n/g, '<br>');
      if (photoPreviewCaption) {
        photoPreviewCaption.innerHTML = captionHtml || '—';
      }
      if (photoPreviewDownload) {
        if (photo.url) {
          photoPreviewDownload.href = photo.url;
          photoPreviewDownload.classList.remove('disabled');
        } else {
          photoPreviewDownload.href = '#';
          photoPreviewDownload.classList.add('disabled');
        }
      }
    }

    function buildPhotoPreviewCarousel(photos, activeIndex) {
      if (!photoPreviewCarouselInner) return;
      photoPreviewCarouselInner.innerHTML = '';
      photos.forEach((photo, index) => {
        const item = document.createElement('div');
        item.className = `carousel-item${index === activeIndex ? ' active' : ''}`;
        item.innerHTML = `<img src="${escapeHtml(photo.url)}" class="d-block w-100 rounded" alt="Фото" data-photo-id="${photo.id != null ? photo.id : ''}" />`;
        photoPreviewCarouselInner.appendChild(item);
      });
      const hasMultiple = photos.length > 1;
      if (photoPreviewPrev) {
        photoPreviewPrev.classList.toggle('d-none', !hasMultiple);
      }
      if (photoPreviewNext) {
        photoPreviewNext.classList.toggle('d-none', !hasMultiple);
      }
    }

    function openPhotoPreviewById(photoId) {
      if (!photoPreviewModalEl || !photoPreviewCarouselEl) return;
      const photos = Array.isArray(passportData.photos) ? passportData.photos : [];
      if (!photos.length) return;
      currentPhotoPreviewList = photos;
      let activeIndex = photos.findIndex((photo) => String(photo.id) === String(photoId));
      if (activeIndex < 0) {
        activeIndex = 0;
      }
      buildPhotoPreviewCarousel(currentPhotoPreviewList, activeIndex);
      if (typeof bootstrap !== 'undefined') {
        const existingCarousel = bootstrap.Carousel.getInstance(photoPreviewCarouselEl);
        if (existingCarousel) {
          existingCarousel.dispose();
        }
        photoPreviewCarouselInstance = bootstrap.Carousel.getOrCreateInstance(photoPreviewCarouselEl, {
          interval: false,
          ride: false,
          wrap: true,
        });
        if (typeof photoPreviewCarouselInstance.to === 'function') {
          photoPreviewCarouselInstance.to(activeIndex);
        }
        updatePhotoPreviewMeta(activeIndex);
        if (!photoPreviewModalInstance) {
          photoPreviewModalInstance = new bootstrap.Modal(photoPreviewModalEl);
        }
        photoPreviewModalInstance.show();
      } else {
        updatePhotoPreviewMeta(activeIndex);
      }
    }

    function openSinglePhotoPreview(url, caption) {
      if (!photoPreviewModalEl || !photoPreviewCarouselEl) return;
      const safeUrl = url || '';
      if (!safeUrl) return;
      let decodedCaption = '';
      if (caption) {
        try {
          decodedCaption = decodeURIComponent(caption);
        } catch (error) {
          decodedCaption = caption;
        }
      }
      currentPhotoPreviewList = [
        {
          id: '__single__',
          url: safeUrl,
          caption: decodedCaption,
        },
      ];
      buildPhotoPreviewCarousel(currentPhotoPreviewList, 0);
      if (typeof bootstrap !== 'undefined') {
        const existingCarousel = bootstrap.Carousel.getInstance(photoPreviewCarouselEl);
        if (existingCarousel) {
          existingCarousel.dispose();
        }
        photoPreviewCarouselInstance = bootstrap.Carousel.getOrCreateInstance(photoPreviewCarouselEl, {
          interval: false,
          ride: false,
          wrap: false,
        });
        if (typeof photoPreviewCarouselInstance.to === 'function') {
          photoPreviewCarouselInstance.to(0);
        }
        updatePhotoPreviewMeta(0);
        if (!photoPreviewModalInstance) {
          photoPreviewModalInstance = new bootstrap.Modal(photoPreviewModalEl);
        }
        photoPreviewModalInstance.show();
      } else {
        updatePhotoPreviewMeta(0);
      }
    }

    if (photoPreviewCarouselEl) {
      photoPreviewCarouselEl.addEventListener('slid.bs.carousel', (event) => {
        const nextIndex = typeof event.to === 'number' ? event.to : 0;
        updatePhotoPreviewMeta(nextIndex);
      });
    }

    function renderNetworkFiles(files) {
      const list = Array.isArray(files) ? files : [];
      passportData.network_files = list;
      if (networkFilesList) {
        networkFilesList.innerHTML = '';
      }
      if (!list.length) {
        if (networkFilesEmptyText) {
          networkFilesEmptyText.classList.remove('d-none');
        }
        return;
      }
      if (networkFilesEmptyText) {
        networkFilesEmptyText.classList.add('d-none');
      }
      list.forEach((file) => {
        const item = document.createElement('div');
        item.className = 'list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2';
        item.dataset.id = file.id;
        const sizePart = file.size_display ? escapeHtml(file.size_display) : '';
        const createdPart = file.created_at_display ? escapeHtml(file.created_at_display) : '';
        const metaParts = [sizePart, createdPart].filter(Boolean).join(' · ');
        const downloadUrl = escapeHtml(file.download_url || file.url || '#');
        const viewUrl = escapeHtml(file.url || downloadUrl);
        item.innerHTML = `
          <div class="me-auto">
            <a href="${viewUrl}" target="_blank" rel="noopener" class="fw-semibold text-decoration-none">${escapeHtml(file.original_name || 'Файл')}</a>
            ${metaParts ? `<div class="text-muted small">${metaParts}</div>` : ''}
          </div>
          <div class="btn-group btn-group-sm" role="group">
            <a class="btn btn-outline-primary" href="${downloadUrl}" download>
              ⬇️ Скачать
            </a>
            <button class="btn btn-outline-danger" type="button" data-action="delete-network-file">Удалить</button>
          </div>
        `;
        if (networkFilesList) {
          networkFilesList.appendChild(item);
        }
      });
    }

    async function handlePhotoSave(card) {
      const photoId = card.dataset.id;
      const caption = card.querySelector('.photo-caption').value;
      const category = card.querySelector('.photo-category').value;
      try {
        const response = await fetch(`/api/object_passports/photos/${photoId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caption, category }),
        });
        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || 'Ошибка при сохранении фото');
        }
        renderPhotos(data.photos || []);
        showSaveMessage('success', 'Фото обновлено.');
      } catch (error) {
        console.error(error);
        showSaveMessage('error', error.message || 'Не удалось обновить фото.');
      }
    }

    async function handlePhotoDelete(card) {
      const photoId = card.dataset.id;
      if (!confirm('Удалить фото?')) return;
      try {
        const response = await fetch(`/api/object_passports/photos/${photoId}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || 'Ошибка при удалении фото');
        }
        renderPhotos(data.photos || []);
        showSaveMessage('success', 'Фото удалено.');
      } catch (error) {
        console.error(error);
        showSaveMessage('error', error.message || 'Не удалось удалить фото.');
      }
    }

    function togglePhotoEdit(card, forceState) {
      if (!card) return;
      const form = card.querySelector('.photo-edit-form');
      if (!form) return;
      let show;
      if (typeof forceState === 'boolean') {
        show = forceState;
      } else {
        show = form.classList.contains('d-none');
      }
      if (show) {
        const photoId = card.dataset.id;
        const currentPhoto = (passportData.photos || []).find((item) => String(item.id) === String(photoId));
        if (currentPhoto) {
          const captionInput = form.querySelector('.photo-caption');
          const categorySelect = form.querySelector('.photo-category');
          if (captionInput) {
            captionInput.value = currentPhoto.caption || '';
            setupAutoResizeInput(captionInput);
          }
          if (categorySelect) categorySelect.value = currentPhoto.category || 'archive';
        }
        form.classList.remove('d-none');
      } else {
        form.classList.add('d-none');
      }
    }

    photosContainer.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) {
        const previewTarget = event.target.closest('.passport-photo');
        if (previewTarget) {
          openPhotoPreviewById(previewTarget.dataset.photoId);
        }
        return;
      }
      event.preventDefault();
      const card = actionEl.closest('.photo-card');
      if (!card) return;
      const action = actionEl.dataset.action;
      if (action === 'save-photo') {
        handlePhotoSave(card);
      } else if (action === 'delete-photo') {
        handlePhotoDelete(card);
      } else if (action === 'toggle-photo-edit') {
        togglePhotoEdit(card);
      } else if (action === 'cancel-photo-edit') {
        togglePhotoEdit(card, false);
      }
    });

    function showPhotoPreview(url, caption) {
      openSinglePhotoPreview(url, caption);
    }

    photoUploadForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (passportData.is_new) {
        showSaveMessage('error', 'Сначала сохраните паспорт.');
        return;
      }
      const formData = new FormData(photoUploadForm);
      try {
        const response = await fetch(`/api/object_passports/${passportData.id}/photos`, {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || 'Ошибка при загрузке фото');
        }
        photoUploadForm.reset();
        initializeAutoResizeInputs(photoUploadForm);
        renderPhotos(data.photos || []);
        showSaveMessage('success', 'Фото добавлено.');
      } catch (error) {
        console.error(error);
        showSaveMessage('error', error.message || 'Не удалось загрузить фото.');
      }
    });

     if (networkFilesForm) {
      networkFilesForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (passportData.is_new) {
          showSaveMessage('error', 'Сначала сохраните паспорт.');
          return;
        }
        const formData = new FormData(networkFilesForm);
        const uploadedFile = formData.get('file');
        if (!uploadedFile || !uploadedFile.name) {
          showSaveMessage('error', 'Выберите файл для загрузки.');
          return;
        }
        try {
          const response = await fetch(`/api/object_passports/${passportData.id}/network_files`, {
            method: 'POST',
            body: formData,
          });
          const data = await response.json();
          if (!response.ok || data.success === false) {
            throw new Error(data.error || 'Ошибка при загрузке файла');
          }
          networkFilesForm.reset();
          renderNetworkFiles(data.files || []);
          showSaveMessage('success', 'Файл добавлен.');
        } catch (error) {
          console.error(error);
          showSaveMessage('error', error.message || 'Не удалось загрузить файл.');
        }
      });
    }

    if (networkFilesList) {
      networkFilesList.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-action="delete-network-file"]');
        if (!button) return;
        const item = button.closest('.list-group-item');
        if (!item) return;
        if (!confirm('Удалить файл?')) return;
        const fileId = item.dataset.id;
        try {
          const response = await fetch(`/api/object_passports/network_files/${fileId}`, { method: 'DELETE' });
          const data = await response.json();
          if (!response.ok || data.success === false) {
            throw new Error(data.error || 'Ошибка при удалении файла');
          }
          renderNetworkFiles(data.files || []);
          showSaveMessage('success', 'Файл удалён.');
        } catch (error) {
          console.error(error);
          showSaveMessage('error', error.message || 'Не удалось удалить файл.');
        }
      });
    }

    async function ensurePassportDataLoaded() {
      const hasMeaningfulInitialPayload = passportData
        && typeof passportData === 'object'
        && Object.keys(passportData).some((key) => !['id', 'is_new'].includes(key));
      if ((hasMeaningfulInitialPayload && !initialPassportParseFailed) || passportData.is_new || !passportData.id) {
        populateForm();
        return;
      }

      try {
        const response = await fetch(`/api/object_passports/${passportData.id}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        if (data && data.passport) {
          passportData = data.passport;
          passportData.is_new = false;
        }
      } catch (error) {
        console.error('Failed to fetch passport data:', error);
        showSaveMessage('error', 'Не удалось загрузить паспорт. Попробуйте обновить страницу.');
      }

      populateForm();
    }

    document.querySelectorAll('[data-action="add-parameter"]').forEach((button) => {
      button.addEventListener('click', () => addParameter(button.dataset.paramType, button.dataset.target));
    });

    document.querySelectorAll('#scheduleTable .schedule-24').forEach((checkbox) => {
      checkbox.addEventListener('change', () => {
        toggleScheduleInputs(checkbox.closest('tr'), checkbox.checked);
      });
    });

    initializeSearchableSelects();

    if (statusHistoryCollapse) {
      statusHistoryCollapse.addEventListener('shown.bs.collapse', () => updateStatusHistoryToggleLabel(true));
      statusHistoryCollapse.addEventListener('hidden.bs.collapse', () => updateStatusHistoryToggleLabel(false));
    }
    updateStatusHistoryToggleLabel(false);

    function handleTitlePhotoClick() {
      if (!titlePhotoPreview || !titlePhotoImage) return;
      const photoId = titlePhotoPreview.dataset.photoId || titlePhotoImage.dataset.photoId;
      if (photoId) {
        openPhotoPreviewById(photoId);
      } else if (titlePhotoImage.src) {
        openSinglePhotoPreview(titlePhotoImage.src, '');
      }
    }

    if (titlePhotoPreview) {
      titlePhotoPreview.addEventListener('click', handleTitlePhotoClick);
    }
    if (titlePhotoImage) {
      titlePhotoImage.addEventListener('click', handleTitlePhotoClick);
    }

    statusSelect.addEventListener('change', () => {
      updateStatusBadge();
      updateStatusTaskRequirement();
    });
    const handleInternalNetworkChange = () => {
      updateNetworkBadge();
      refreshEquipmentIpPreviews();
    };
    internalNetworkInput.addEventListener('input', handleInternalNetworkChange);
    internalNetworkInput.addEventListener('change', handleInternalNetworkChange);
    networkProviderInput.addEventListener('input', () => {
      updateNetworkRestaurantIdOptionsForProvider(networkProviderInput.value);
    });
    networkProviderInput.addEventListener('change', () => handleNetworkProfileSelection('provider', networkProviderInput.value));
    networkContractInput.addEventListener('change', () => handleNetworkProfileSelection('contract_number', networkContractInput.value));
    networkRestaurantIdInput.addEventListener('change', () => handleNetworkProfileSelection('restaurant_id', networkRestaurantIdInput.value));
    networkSupportPhoneInput.addEventListener('change', () => handleNetworkProfileSelection('support_phone', networkSupportPhoneInput.value));
    networkSpeedInput.addEventListener('change', handleSpeedFormatting);
    networkSpeedInput.addEventListener('blur', handleSpeedFormatting);
    networkLegalEntityInput.addEventListener('change', () => handleNetworkProfileSelection('legal_entity', networkLegalEntityInput.value));
    [countrySelect, partnerTypeSelect, businessSelect].forEach((select) => {
      if (!select) return;
      select.addEventListener('change', () => {
        refreshLocationParameterOptions({ preserveCurrent: false });
      });
    });
    if (cityInput) {
      cityInput.addEventListener('change', () => {
        refreshLocationParameterOptions({ preserveCurrent: false });
      });
      cityInput.addEventListener('input', () => {
        refreshCityOptions({ preserveCurrent: true });
        updateObjectTitle();
      });
    }
    if (businessSelect) {
      businessSelect.addEventListener('change', updateObjectTitle);
    }
    if (departmentSelect) {
      departmentSelect.addEventListener('change', () => {
        applyDepartmentSelectionContext();
        updateObjectTitle();
      });
    }
    if (toggleItBlockBtn && itBlock) {
      toggleItBlockBtn.addEventListener('click', () => {
        const hiddenNow = itBlock.classList.toggle('d-none');
        itBlock.dataset.userCollapsed = hiddenNow ? 'true' : 'false';
        syncItBlockToggleButton();
      });
      syncItBlockToggleButton();
    }
    refreshCasesBtn.addEventListener('click', refreshCases);
    if (refreshTasksBtn) {
      refreshTasksBtn.addEventListener('click', refreshTasks);
    }
    if (statusTaskSelect) {
      statusTaskSelect.addEventListener('change', () => {
        const rawValue = statusTaskSelect.value;
        const numericValue = rawValue ? Number(rawValue) : null;
        passportData.status_task_id = Number.isNaN(numericValue) ? null : numericValue;
        if (rawValue) {
          const selectedTask = (passportData.tasks || []).find((task) => String(task.id) === rawValue);
          passportData.status_task = selectedTask || passportData.status_task;
        } else {
          passportData.status_task = null;
        }
        syncSelectSearchInput(statusTaskSelect);
        updateStatusTaskInfo();
      });
    }
    if (statusTaskSearchInput && statusTaskSelect) {
      statusTaskSearchInput.addEventListener('input', () => filterSelectOptions(statusTaskSelect, statusTaskSearchInput.value));
      statusTaskSearchInput.addEventListener('focus', () => filterSelectOptions(statusTaskSelect, statusTaskSearchInput.value));
    }
    savePassportBtn.addEventListener('click', async () => {
      await savePassport();
    });

    document.querySelectorAll('[data-section-toggle]').forEach((button) => {
      const targetSelector = button.dataset.target;
      const target = targetSelector ? document.querySelector(targetSelector) : null;
      if (!target) return;
      const updateState = () => {
        const expanded = target.classList.contains('show');
        button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        button.textContent = expanded ? 'Свернуть ▲' : 'Развернуть ▼';
      };
      updateState();
      button.addEventListener('click', () => {
        target.classList.toggle('show');
        updateState();
      });
    });

    document.querySelectorAll('[data-section-header]').forEach((header) => {
      header.addEventListener('click', (event) => {
        const interactiveTarget = event.target.closest(
          'button, a, input, select, textarea, [data-bs-toggle], [data-no-header-toggle]'
        );
        if (interactiveTarget) {
          return;
        }
        const toggleButton = header.querySelector('[data-section-toggle]');
        if (toggleButton) {
          toggleButton.click();
        }
      });
    });

    if (window.EditGuard) {
      const passportBlocks = [
        'basicInfoCard',
        'networkCard',
        'scheduleCard'
      ];
      passportBlocks.forEach((blockId) => {
        const blockEl = document.getElementById(blockId);
        if (!blockEl) return;
        window.EditGuard.registerBlock(blockEl, {
          onSave: () => savePassport()
        });
      });
    }

    ensurePassportDataLoaded();
  </script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/modal-transitions.js}"></script>
</body>
</html>
