<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <title>Паспорт объекта — iguana</title>

    <link rel="stylesheet"
          href="/vendor/bootstrap/5.3.3/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260908-01-259-r4-4')}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="with-sidebar sidebar-pinned passport-detail-page" data-ui-page="passports">
<div th:replace="~{fragments/navbar :: navbar('passports')}"></div>

<main class="main-content container-fluid py-3 page-shell passports-page-shell ops-page-shell passport-workspace-shell">
    <div class="passport-workspace-loading" id="passportWorkspaceLoading" role="status">
        Загружаем паспорт объекта…
    </div>

    <div class="passport-workspace d-none" id="passportWorkspace">
        <header class="passport-workspace-header">
            <div class="passport-workspace-header__identity">
                <div class="passport-workspace-cover" id="passportWorkspaceCover" aria-hidden="true">
                    <span>PO</span>
                </div>

                <div class="passport-workspace-header__copy">
                    <div class="passport-workspace-eyebrow">
                        <span>Паспорт объекта</span>
                        <span class="passport-workspace-source d-none" id="passportWorkspaceSource"></span>
                    </div>
                    <div class="passport-workspace-title-row">
                        <h1 class="passport-workspace-title" id="passportWorkspaceTitle">—</h1>
                        <span class="passport-workspace-status" id="passportWorkspaceStatus">—</span>
                    </div>
                    <div class="passport-workspace-subtitle" id="passportWorkspaceSubtitle">—</div>
                    <div class="passport-workspace-meta" id="passportWorkspaceMeta"></div>
                </div>
            </div>

            <div class="passport-workspace-header__actions">
                <a class="btn btn-sm btn-outline-secondary" href="/object-passports">← К списку</a>
                <button class="btn btn-sm btn-primary" id="passportEditLink" type="button">Изменить</button>
            </div>
        </header>

        <div class="passport-kpi-strip" aria-label="Краткая статистика паспорта">
            <button type="button" class="passport-kpi" data-passport-tab-target="equipment">
                <span class="passport-kpi__label">Оборудование</span>
                <strong class="passport-kpi__value" id="passportEquipmentCount">0</strong>
            </button>
            <button type="button" class="passport-kpi" data-passport-tab-target="cases">
                <span class="passport-kpi__label">Обращения</span>
                <strong class="passport-kpi__value" id="passportCasesCount">0</strong>
            </button>
            <button type="button" class="passport-kpi" data-passport-tab-target="tasks">
                <span class="passport-kpi__label">Задачи</span>
                <strong class="passport-kpi__value" id="passportTasksCount">0</strong>
            </button>
            <button type="button" class="passport-kpi" data-passport-tab-target="photos">
                <span class="passport-kpi__label">Фото</span>
                <strong class="passport-kpi__value" id="passportPhotosCount">0</strong>
            </button>
            <div class="passport-kpi passport-kpi--quality">
                <span class="passport-kpi__label">Заполненность</span>
                <strong class="passport-kpi__value" id="passportCompletionValue">0%</strong>
                <span class="passport-kpi__hint" id="passportCompletionHint"></span>
            </div>
        </div>

        <nav class="passport-workspace-tabs" aria-label="Разделы паспорта">
            <button class="passport-workspace-tab is-active" type="button" data-passport-tab="overview">Обзор</button>
            <button class="passport-workspace-tab" type="button" data-passport-tab="network">IT и сеть</button>
            <button class="passport-workspace-tab" type="button" data-passport-tab="equipment">
                Оборудование <span class="passport-tab-count" id="passportEquipmentTabCount">0</span>
            </button>
            <button class="passport-workspace-tab" type="button" data-passport-tab="cases">
                Обращения <span class="passport-tab-count" id="passportCasesTabCount">0</span>
            </button>
            <button class="passport-workspace-tab" type="button" data-passport-tab="tasks">
                Задачи <span class="passport-tab-count" id="passportTasksTabCount">0</span>
            </button>
            <button class="passport-workspace-tab" type="button" data-passport-tab="photos">
                Фото <span class="passport-tab-count" id="passportPhotosTabCount">0</span>
            </button>
        </nav>

        <th:block th:replace="~{passports/fragments/detail-overview :: overviewPanel}"></th:block>

        <th:block th:replace="~{passports/fragments/detail-network :: networkPanel}"></th:block>

        <th:block th:replace="~{passports/fragments/detail-equipment :: equipmentPanel}"></th:block>

        <th:block th:replace="~{passports/fragments/detail-activity :: activityPanels}"></th:block>

        <th:block th:replace="~{passports/fragments/detail-media :: photosPanel}"></th:block>
    </div>


    <th:block th:replace="~{passports/fragments/detail-media :: photoViewer}"></th:block>

    <th:block th:replace="~{passports/fragments/detail-edit :: passportEditLayer}"></th:block>

    <div class="alert alert-danger d-none" id="passportWorkspaceError" role="alert"></div>
</main>

<script src="/js/passport-detail-core-runtime.js?v=20260916-01-260-p4a"></script>
<script src="/js/passport-detail-header-runtime.js?v=20260916-01-260-p4g"></script>
<script src="/js/passport-detail-overview-runtime.js?v=20260916-01-260-p4b"></script>
<script src="/js/passport-detail-network-runtime.js?v=20260916-01-260-p4c"></script>
<script src="/js/passport-detail-equipment-runtime.js?v=20260916-01-260-p4d"></script>
<script src="/js/passport-detail-activity-runtime.js?v=20260916-01-260-p4e"></script>
<script src="/js/passport-detail-media-runtime.js?v=20260916-01-260-p4f"></script>
<script src="/js/passport-detail-editor-runtime.js?v=20260916-01-260-p4h"></script>
<script th:inline="javascript">
(() => {
    const catalogRaw = /*[[${itEquipmentCatalog}]]*/ [];
    const equipmentCatalog = Array.isArray(catalogRaw) ? catalogRaw : [];
    const initialEditMode = /*[[${passportEditMode}]]*/ false;
    const statusesRawValue = /*[[${statuses}]]*/ [];
    const statusesRaw = Array.isArray(statusesRawValue) ? statusesRawValue : [];
    const parameterValuesRawValue = /*[[${parameterValues}]]*/ {};
    const parameterValuesRaw = parameterValuesRawValue && typeof parameterValuesRawValue === 'object' ? parameterValuesRawValue : {};
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
    const idMatch = window.location.pathname.match(/object-passports\/(\d+)/);
    const passportId = idMatch ? Number(idMatch[1]) : null;

    const loading = document.getElementById('passportWorkspaceLoading');
    const workspace = document.getElementById('passportWorkspace');
    const errorBox = document.getElementById('passportWorkspaceError');
    const equipmentSearch = document.getElementById('passportEquipmentSearch');

    let passport = {};
    let cases = [];
    let tasks = [];
    let incidents = [];

    const passportDetailCoreRuntime = window.PassportDetailCoreRuntime?.mount({
        equipmentCatalog
    });
    if (!passportDetailCoreRuntime) {
        throw new Error('PassportDetailCoreRuntime is unavailable');
    }
    const {
        DAY_LABELS,
        text,
        escapeHtml,
        normalizeKey,
        first,
        statusTone,
        setStatus,
        renderProperties,
        parseCatalogMedia,
        parseLinks,
        isEquipmentArchived,
        catalogKey,
        findCatalogItem,
    } = passportDetailCoreRuntime;
    const passportDetailHeaderRuntime = window.PassportDetailHeaderRuntime?.mount({
        getPassport: () => passport,
        getPassportId: () => passportId,
        coreRuntime: passportDetailCoreRuntime,
    });
    if (!passportDetailHeaderRuntime) {
        throw new Error('PassportDetailHeaderRuntime is unavailable');
    }
    const { renderCover, renderHeader } = passportDetailHeaderRuntime;
    const passportDetailOverviewRuntime = window.PassportDetailOverviewRuntime?.mount({
        getPassport: () => passport,
        coreRuntime: passportDetailCoreRuntime,
    });
    if (!passportDetailOverviewRuntime) {
        throw new Error('PassportDetailOverviewRuntime is unavailable');
    }
    const { renderOverview } = passportDetailOverviewRuntime;
    const passportDetailNetworkRuntime = window.PassportDetailNetworkRuntime?.mount({
        getPassport: () => passport,
        coreRuntime: passportDetailCoreRuntime,
    });
    if (!passportDetailNetworkRuntime) {
        throw new Error('PassportDetailNetworkRuntime is unavailable');
    }
    const { renderNetwork } = passportDetailNetworkRuntime;
    const passportDetailEquipmentRuntime = window.PassportDetailEquipmentRuntime?.mount({
        getPassport: () => passport,
        coreRuntime: passportDetailCoreRuntime,
    });
    if (!passportDetailEquipmentRuntime) {
        throw new Error('PassportDetailEquipmentRuntime is unavailable');
    }
    const { renderEquipment } = passportDetailEquipmentRuntime;
    const passportDetailActivityRuntime = window.PassportDetailActivityRuntime?.mount({
        getCases: () => cases,
        getTasks: () => tasks,
        getIncidents: () => incidents,
        coreRuntime: passportDetailCoreRuntime,
    });
    if (!passportDetailActivityRuntime) {
        throw new Error('PassportDetailActivityRuntime is unavailable');
    }
    const { renderActivity } = passportDetailActivityRuntime;
    const passportDetailMediaRuntime = window.PassportDetailMediaRuntime?.mount({
        getPassport: () => passport,
        coreRuntime: passportDetailCoreRuntime,
    });
    if (!passportDetailMediaRuntime) {
        throw new Error('PassportDetailMediaRuntime is unavailable');
    }
    const { renderPhotos, openPhotoViewer, closePhotoViewer, movePhotoViewer } = passportDetailMediaRuntime;
    const passportDetailEditorRuntime = window.PassportDetailEditorRuntime?.mount({
        getPassport: () => passport,
        setPassport: (value) => { passport = value && typeof value === 'object' ? value : {}; },
        getPassportId: () => passportId,
        equipmentCatalog,
        statusesRaw,
        parameterValuesRaw,
        csrfToken,
        coreRuntime: passportDetailCoreRuntime,
        refreshWorkspace: () => {
            renderHeader();
            renderOverview();
            renderNetwork();
            renderEquipment();
            renderActivity();
            renderPhotos();
            updateCounts();
        },
        refreshMedia: () => {
            renderCover();
            renderPhotos();
            updateCounts();
        },
    });
    if (!passportDetailEditorRuntime) {
        throw new Error('PassportDetailEditorRuntime is unavailable');
    }
    const { openEditor, closeEditor, bindEvents: bindEditorEvents } = passportDetailEditorRuntime;
    function bindR4Events() {
        bindEditorEvents();
        document.getElementById('passportPhotoGrid')?.addEventListener('click', (event) => {
            const tile = event.target.closest('[data-passport-photo-index]');
            if (tile) openPhotoViewer(tile.dataset.passportPhotoIndex);
        });
        document.getElementById('passportWorkspaceCover')?.addEventListener('click', () => {
            const cover = document.getElementById('passportWorkspaceCover');
            if (cover && cover.dataset.passportPhotoIndex != null) openPhotoViewer(cover.dataset.passportPhotoIndex);
        });
        document.querySelectorAll('[data-passport-photo-close]').forEach((button) => button.addEventListener('click', closePhotoViewer));
        document.querySelector('[data-passport-photo-prev]')?.addEventListener('click', () => movePhotoViewer(-1));
        document.querySelector('[data-passport-photo-next]')?.addEventListener('click', () => movePhotoViewer(1));
        document.addEventListener('keydown', (event) => {
            const viewer = document.getElementById('passportPhotoViewer');
            if (viewer && !viewer.hidden) {
                if (event.key === 'Escape') closePhotoViewer();
                if (event.key === 'ArrowLeft') movePhotoViewer(-1);
                if (event.key === 'ArrowRight') movePhotoViewer(1);
                return;
            }
            const layer = document.getElementById('passportEditLayer');
            if (layer && !layer.hidden && event.key === 'Escape') closeEditor();
        });
    }

    function updateCounts() {
        const equipmentCount = Array.isArray(passport.equipment)
            ? passport.equipment.filter((item) => !isEquipmentArchived(item)).length
            : 0;
        const photosCount = Array.isArray(passport.photos) ? passport.photos.length : 0;
        const values = {
            passportEquipmentCount: equipmentCount,
            passportEquipmentTabCount: equipmentCount,
            passportCasesCount: cases.length,
            passportCasesTabCount: cases.length,
            passportTasksCount: tasks.length,
            passportTasksTabCount: tasks.length,
            passportPhotosCount: photosCount,
            passportPhotosTabCount: photosCount
        };
        Object.entries(values).forEach(([id, value]) => {
            const node = document.getElementById(id);
            if (node) node.textContent = String(value);
        });
    }

    function activateTab(name) {
        document.querySelectorAll('[data-passport-tab]').forEach((button) => {
            button.classList.toggle('is-active', button.dataset.passportTab === name);
        });
        document.querySelectorAll('[data-passport-panel]').forEach((panel) => {
            panel.classList.toggle('is-active', panel.dataset.passportPanel === name);
        });
        if (name === 'equipment' && equipmentSearch) {
            window.requestAnimationFrame(() => equipmentSearch.focus({ preventScroll: true }));
        }
    }

    function bindTabs() {
        document.addEventListener('click', (event) => {
            const tab = event.target.closest('[data-passport-tab]');
            if (tab) {
                activateTab(tab.dataset.passportTab);
                return;
            }
            const shortcut = event.target.closest('[data-passport-tab-target]');
            if (shortcut) activateTab(shortcut.dataset.passportTabTarget);
        });
        if (equipmentSearch) equipmentSearch.addEventListener('input', renderEquipment);
    }

    async function loadJson(url, fallback) {
        try {
            const response = await fetch(url, { headers: { Accept: 'application/json' } });
            if (!response.ok) return fallback;
            return await response.json();
        } catch (error) {
            return fallback;
        }
    }

    async function load() {
        if (!Number.isFinite(passportId) || passportId <= 0) {
            throw new Error('Не удалось определить ID паспорта объекта.');
        }

        const [passportResponse, casesResponse, tasksResponse, incidentsResponse] = await Promise.all([
            loadJson(`/api/object_passports/${passportId}`, null),
            loadJson(`/api/object_passports/${passportId}/cases`, { items: [] }),
            loadJson(`/api/object_passports/${passportId}/tasks`, { items: [] }),
            loadJson(`/api/object_passports/${passportId}/incidents`, { items: [] })
        ]);

        if (!passportResponse || passportResponse.success === false || !passportResponse.passport) {
            throw new Error('Паспорт объекта не найден или недоступен.');
        }

        passport = passportResponse.passport || {};
        cases = Array.isArray(casesResponse && casesResponse.items) ? casesResponse.items : (Array.isArray(passport.cases) ? passport.cases : []);
        tasks = Array.isArray(tasksResponse && tasksResponse.items) ? tasksResponse.items : (Array.isArray(passport.tasks) ? passport.tasks : []);
        incidents = Array.isArray(incidentsResponse && incidentsResponse.items) ? incidentsResponse.items : [];

        renderHeader();
        renderOverview();
        renderNetwork();
        renderEquipment();
        renderActivity();
        renderPhotos();
        updateCounts();
        loading.classList.add('d-none');
        workspace.classList.remove('d-none');
        if (initialEditMode) openEditor('main');
    }

    bindTabs();
    bindR4Events();
    load().catch((error) => {
        loading.classList.add('d-none');
        errorBox.textContent = error && error.message ? error.message : String(error);
        errorBox.classList.remove('d-none');
    });
})();
</script>
<script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
