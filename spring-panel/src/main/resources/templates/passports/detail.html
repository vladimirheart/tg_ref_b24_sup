<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Паспорт объекта — iguana</title>

	<link rel="stylesheet"
		  href="/vendor/bootstrap/5.3.3/bootstrap.min.css"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">

	<th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>

	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="with-sidebar sidebar-pinned passport-detail-page" data-ui-page="passports">
<div th:replace="~{fragments/navbar :: navbar('passports')}"></div>
<main class="main-content container-fluid py-4 page-shell passports-page-shell ops-page-shell"
		  th:if="${item != null}">

		<div class="page-header-card passports-page-header mb-4 ops-page-header">
			<div>
				<span class="page-kicker">Паспорт объекта</span>

				<h1 class="page-title"
					th:text="${item.equipmentModel} ?: 'Паспорт объекта'">
					Паспорт объекта
				</h1>

				<p class="page-subtitle mb-0">
					Технические данные и идентификация выбранного оборудования.
				</p>
			</div>

			<div class="passports-page-actions ops-page-actions">
				<a class="btn btn-outline-secondary"
				   th:href="@{/object-passports}">
					К каталогу
				</a>
			</div>
		</div>

    <div class="row g-4">
        <div class="col-12 col-lg-8">
            <div class="card passport-detail-card h-100 ops-section-card">
				<div class="card-body">
					<dl class="row mb-0 passport-detail-list">
                        <dt class="col-sm-4">Тип</dt>
                        <dd class="col-sm-8" th:text="${item.equipmentType} ?: '—'"></dd>

                        <dt class="col-sm-4">Производитель</dt>
                        <dd class="col-sm-8" th:text="${item.equipmentVendor} ?: '—'"></dd>

                        <dt class="col-sm-4">Модель</dt>
                        <dd class="col-sm-8" th:text="${item.equipmentModel} ?: '—'"></dd>

                        <dt class="col-sm-4">Серийный номер</dt>
                        <dd class="col-sm-8" th:text="${item.serialNumber} ?: '—'"></dd>

                        <dt class="col-sm-4">Комплектация</dt>
                        <dd class="col-sm-8" th:text="${item.accessories} ?: '—'"></dd>

                        <dt class="col-sm-4">Создан</dt>
                        <dd class="col-sm-8" th:text="${item.createdAt} ?: '—'"></dd>

                        <dt class="col-sm-4">Обновлён</dt>
                        <dd class="col-sm-8" th:text="${item.updatedAt} ?: '—'"></dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card passport-detail-card passport-photo-card h-100 ops-section-card">
				<div class="card-body">
					<div class="passport-detail-section-title">
						Фото
					</div>

					<div class="passport-photo-frame"
						 th:if="${item.photoUrl}">
						<img th:src="${item.photoUrl}"
							 alt="Фото оборудования"
							 class="passport-detail-photo">
					</div>

					<div class="passport-photo-empty"
						 th:if="${item.photoUrl == null || item.photoUrl.isBlank()}">
						Фото не загружено
					</div>
				</div>
			</div>
        </div>
    </div>
</main>
<script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
