<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Паспорта объектов — iguana</title>

<link rel="stylesheet"
      href="/vendor/bootstrap/5.3.3/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">

<th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/app.css(v='20260907-01-258-r2')}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="with-sidebar sidebar-pinned passports-list-page" data-ui-page="passports">
<div th:replace="~{fragments/navbar :: navbar('passports')}"></div>
<main class="main-content container-fluid py-4 page-shell passports-page-shell ops-page-shell">

    <div class="page-header-card passports-page-header mb-3 ops-page-header">
        <div class="passports-page-heading">
            <h1 class="page-title mb-0">Паспорта объектов</h1>
        </div>

        <div class="passports-page-actions ops-page-actions">
            <input id="passportsSearchInput"
                   type="search"
                   class="form-control passport-quick-search"
                   placeholder="Поиск по всем полям"
                   aria-label="Поиск по паспортам объектов">

            <button class="btn btn-outline-secondary passport-icon-action"
                    id="passportsFiltersBtn"
                    type="button"
                    title="Фильтры"
                    aria-label="Фильтры"
                    data-bs-toggle="modal"
                    data-bs-target="#passportsFiltersModal">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <a class="btn btn-primary passport-icon-action"
               th:if="${canViewSettings}"
               th:href="@{/object-passports/new}"
               title="Создать паспорт"
               aria-label="Создать паспорт">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </a>
        </div>
    </div>

    <div class="passport-summary-panel mb-3 ops-list-toolbar">
		<div class="passport-summary-metrics">
			<span class="passport-summary-chip passport-summary-chip--primary">
				Всего:
				<strong id="passportsTotalCount"
						th:text="${#lists.size(items)}">0</strong>
			</span>

			<span class="passport-summary-chip">
				Показано:
				<strong id="passportsShownCount"
						th:text="${#lists.size(items)}">0</strong>
			</span>

			<span class="text-muted small"
				  id="passportsSummaryText">
				Сортировка по департаменту, городу, бизнесу, статусу,
				адресу и числу обращений доступна по клику на заголовок столбца.
			</span>
		</div>
	</div>

    <div class="card passport-table-card ops-table-card">
		<div class="table-responsive passport-table-shell ops-table-shell">
			<table class="table align-middle mb-0 passport-table"
				   id="passportsTable">
				<thead>
                <tr>
                    <th class="passport-sortable"
						data-sort-key="department"
						data-sort-type="text"
						tabindex="0">
						Департамент <span class="sort-indicator">↕</span>
					</th>

					<th class="passport-sortable"
						data-sort-key="city"
						data-sort-type="text"
						tabindex="0">
						Город <span class="sort-indicator">↕</span>
					</th>

					<th class="passport-sortable"
						data-sort-key="business"
						data-sort-type="text"
						tabindex="0">
						Бизнес <span class="sort-indicator">↕</span>
					</th>

					<th class="passport-sortable"
						data-sort-key="status"
						data-sort-type="text"
						tabindex="0">
						Статус <span class="sort-indicator">↕</span>
					</th>

					<th class="passport-sortable"
						data-sort-key="location_address"
						data-sort-type="text"
						tabindex="0">
						Адрес <span class="sort-indicator">↕</span>
					</th>

					<th class="passport-sortable text-center"
						data-sort-key="appeals_count"
						data-sort-type="number"
						tabindex="0">
						Обращения <span class="sort-indicator">↕</span>
					</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="passportsTableBody">
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="7" class="text-center text-muted py-4">Каталог пуст</td>
                </tr>
                <tr id="passportsNoResultsRow" class="d-none">
                    <td colspan="7" class="text-center text-muted py-4">По текущим фильтрам ничего не найдено</td>
                </tr>
                <tr th:each="item : ${items}"
                    data-passport-row
                    th:classappend="${item.deleted == true} ? ' passport-row--deleted' : ''"
                    th:attr="data-department=${item.department != null ? item.department : ''},
                             data-city=${item.city != null ? item.city : ''},
                             data-business=${item.business != null ? item.business : ''},
                             data-status=${item.status != null ? item.status : ''},
                             data-location-address=${item.location_address != null ? item.location_address : ''},
                             data-appeals-count=${item.appeals_count != null ? item.appeals_count : 0},
                             data-deleted=${item.deleted == true ? 'true' : 'false'}">
                    <td>
                        <div class="passport-department-cell">
                            <button th:if="${item.title_photo_url != null and !#strings.isEmpty(item.title_photo_url)}"
                                    type="button"
                                    class="passport-title-thumb"
                                    data-passport-title-photo
                                    th:attr="data-photo-url=${item.title_photo_url},aria-label=${'Показать титульное фото: ' + (item.department != null ? item.department : 'паспорт')}"
                                    title="Титульное фото">
                                <img th:src="${item.title_photo_url}" alt="" loading="lazy">
                            </button>
                            <span th:unless="${item.title_photo_url != null and !#strings.isEmpty(item.title_photo_url)}"
                                  class="passport-title-thumb passport-title-thumb--empty"
                                  aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M4 5h16v14H4zM7 15l3-3 2 2 2-2 3 3M9 9h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span class="passport-department-name" th:text="${item.department} ?: '—'"></span>
                        </div>
                    </td>
                    <td th:text="${item.city} ?: '—'"></td>
                    <td th:text="${item.business} ?: '—'"></td>
                    <td>
                        <span class="badge passport-status-badge" th:text="${item.status} ?: '—'"></span>
                    </td>
                    <td th:text="${item.location_address} ?: '—'"></td>
                    <td class="text-center">
                        <span class="badge passport-count-badge" th:text="${item.appeals_count} ?: 0">0</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{'/object-passports/' + ${item.id}}">Открыть</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="passportPhotoPreview" class="passport-photo-preview" hidden aria-hidden="true">
        <img id="passportPhotoPreviewImage" alt="Увеличенное титульное фото">
    </div>

    <div class="modal fade ops-task-modal" id="passportsFiltersModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Фильтры паспортов</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="departmentFilter">Департамент</label>
                            <select id="departmentFilter" class="form-select">
                                <option value="">Все</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="cityFilter">Город</label>
                            <select id="cityFilter" class="form-select">
                                <option value="">Все</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="businessFilter">Бизнес</label>
                            <select id="businessFilter" class="form-select">
                                <option value="">Все</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="statusFilter">Статус</label>
                            <select id="statusFilter" class="form-select">
                                <option value="">Все</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-8">
                            <label class="form-label" for="addressFilter">Адрес</label>
                            <input id="addressFilter" type="search" class="form-control" placeholder="Фильтр по адресу">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="appealsMinFilter">Обращений не меньше</label>
                            <input id="appealsMinFilter" type="number" min="0" step="1" class="form-control" placeholder="0">
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch passport-show-deleted-filter">
                                <input class="form-check-input" type="checkbox" role="switch" id="showDeletedFilter">
                                <label class="form-check-label" for="showDeletedFilter">Показывать удалённые</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="passportsResetFiltersBtn" type="button" class="btn btn-outline-secondary me-auto">Сбросить</button>
                    <button id="passportsApplyFiltersBtn" type="button" class="btn btn-primary" data-bs-dismiss="modal">Применить</button>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    (() => {
        const tableBody = document.getElementById('passportsTableBody');
        const rows = Array.from(document.querySelectorAll('[data-passport-row]'));
        if (!tableBody || !rows.length) {
            return;
        }

        const searchInput = document.getElementById('passportsSearchInput');
        const departmentFilter = document.getElementById('departmentFilter');
        const cityFilter = document.getElementById('cityFilter');
        const businessFilter = document.getElementById('businessFilter');
        const statusFilter = document.getElementById('statusFilter');
        const addressFilter = document.getElementById('addressFilter');
        const appealsMinFilter = document.getElementById('appealsMinFilter');
        const showDeletedFilter = document.getElementById('showDeletedFilter');
        const resetFiltersBtn = document.getElementById('passportsResetFiltersBtn');
        const applyFiltersBtn = document.getElementById('passportsApplyFiltersBtn');
        const totalCount = document.getElementById('passportsTotalCount');
        const shownCount = document.getElementById('passportsShownCount');
        const summaryText = document.getElementById('passportsSummaryText');
        const noResultsRow = document.getElementById('passportsNoResultsRow');
        const sortHeaders = Array.from(document.querySelectorAll('[data-sort-key]'));
        const titlePhotoThumbs = Array.from(document.querySelectorAll('[data-passport-title-photo]'));
        const photoPreview = document.getElementById('passportPhotoPreview');
        const photoPreviewImage = document.getElementById('passportPhotoPreviewImage');
        let photoPreviewTimer = null;
        let photoPreviewHideTimer = null;

        const state = {
            sortKey: 'department',
            sortDirection: 'asc',
        };

        function normalize(value) {
            return String(value || '').trim().toLowerCase().replace(/ё/g, 'е');
        }

        function escapeSelectorValue(value) {
            return String(value || '').trim();
        }

        function readRowValue(row, key) {
            switch (key) {
                case 'location_address':
                    return row.dataset.locationAddress || '';
                case 'appeals_count':
                    return row.dataset.appealsCount || '0';
                default:
                    return row.dataset[key] || '';
            }
        }

        function buildSearchableText(row) {
            return normalize([
                readRowValue(row, 'department'),
                readRowValue(row, 'city'),
                readRowValue(row, 'business'),
                readRowValue(row, 'status'),
                readRowValue(row, 'location_address'),
                readRowValue(row, 'appeals_count'),
            ].join(' '));
        }

        function buildOptions(select, values) {
            if (!select) return;
            const current = select.value;
            select.innerHTML = '<option value="">Все</option>';
            values.forEach((value) => {
                const option = document.createElement('option');
                option.value = escapeSelectorValue(value);
                option.textContent = escapeSelectorValue(value);
                select.appendChild(option);
            });
            if (Array.from(select.options).some((option) => option.value === current)) {
                select.value = current;
            }
        }

        function populateFilters() {
            const collect = (key) => Array.from(new Set(
                rows.map((row) => readRowValue(row, key)).filter((value) => String(value || '').trim())
            )).sort((a, b) => a.localeCompare(b, 'ru', { sensitivity: 'base' }));

            buildOptions(departmentFilter, collect('department'));
            buildOptions(cityFilter, collect('city'));
            buildOptions(businessFilter, collect('business'));
            buildOptions(statusFilter, collect('status'));
        }

        function matchesFilters(row) {
            const searchNeedle = normalize(searchInput ? searchInput.value : '');
            const addressNeedle = normalize(addressFilter ? addressFilter.value : '');
            const departmentValue = normalize(departmentFilter ? departmentFilter.value : '');
            const cityValue = normalize(cityFilter ? cityFilter.value : '');
            const businessValue = normalize(businessFilter ? businessFilter.value : '');
            const statusValue = normalize(statusFilter ? statusFilter.value : '');
            const minAppealsRaw = appealsMinFilter ? appealsMinFilter.value : '';
            const minAppeals = minAppealsRaw === '' ? null : Number(minAppealsRaw);
            const deletedExplicit = statusValue === 'удален';
            const showDeleted = Boolean(showDeletedFilter && showDeletedFilter.checked);
            const deleted = row.dataset.deleted === 'true';

            if (deleted && !showDeleted && !deletedExplicit) return false;

            const searchable = buildSearchableText(row);
            const department = normalize(readRowValue(row, 'department'));
            const city = normalize(readRowValue(row, 'city'));
            const business = normalize(readRowValue(row, 'business'));
            const status = normalize(readRowValue(row, 'status'));
            const address = normalize(readRowValue(row, 'location_address'));
            const appeals = Number(readRowValue(row, 'appeals_count') || 0);

            if (searchNeedle && !searchable.includes(searchNeedle)) return false;
            if (departmentValue && department !== departmentValue) return false;
            if (cityValue && city !== cityValue) return false;
            if (businessValue && business !== businessValue) return false;
            if (statusValue && status !== statusValue) return false;
            if (addressNeedle && !address.includes(addressNeedle)) return false;
            if (minAppeals != null && !Number.isNaN(minAppeals) && appeals < minAppeals) return false;
            return true;
        }

        function compareRows(left, right) {
            const header = sortHeaders.find((item) => item.dataset.sortKey === state.sortKey);
            const sortType = header ? header.dataset.sortType : 'text';
            const leftValue = readRowValue(left, state.sortKey);
            const rightValue = readRowValue(right, state.sortKey);

            let result = 0;
            if (sortType === 'number') {
                result = Number(leftValue || 0) - Number(rightValue || 0);
            } else {
                result = String(leftValue || '').localeCompare(String(rightValue || ''), 'ru', { sensitivity: 'base' });
            }

            if (result === 0) {
                result = String(readRowValue(left, 'department') || '').localeCompare(
                    String(readRowValue(right, 'department') || ''),
                    'ru',
                    { sensitivity: 'base' }
                );
            }
            return state.sortDirection === 'asc' ? result : -result;
        }

        function updateSortIndicators() {
			sortHeaders.forEach((header) => {
				const active =
					header.dataset.sortKey === state.sortKey;

				if (active) {
					header.setAttribute(
						'aria-sort',
						state.sortDirection === 'asc'
							? 'ascending'
							: 'descending'
					);
				} else {
					header.removeAttribute('aria-sort');
				}

				const indicator =
					header.querySelector('.sort-indicator');

				if (!indicator) {
					return;
				}

				if (!active) {
					indicator.textContent = '↕';
					return;
				}

				indicator.textContent =
					state.sortDirection === 'asc'
						? '↑'
						: '↓';
			});
		}

        function applyState() {
            const statusValue = normalize(statusFilter ? statusFilter.value : '');
            const deletedExplicit = statusValue === 'удален';
            const showDeleted = Boolean(showDeletedFilter && showDeletedFilter.checked);
            const visibilityRows = rows.filter((row) => row.dataset.deleted !== 'true' || showDeleted || deletedExplicit);
            const filteredRows = visibilityRows.filter(matchesFilters).sort(compareRows);
            rows.forEach((row) => {
                row.classList.add('d-none');
                tableBody.appendChild(row);
            });
            filteredRows.forEach((row) => {
                row.classList.remove('d-none');
                tableBody.appendChild(row);
            });

            if (totalCount) {
                totalCount.textContent = String(visibilityRows.length);
            }
            if (shownCount) {
                shownCount.textContent = String(filteredRows.length);
            }
            if (summaryText) {
                const sortLabel = sortHeaders.find((header) => header.dataset.sortKey === state.sortKey)?.textContent?.replace(/[↕↑↓]/g, '').trim() || 'Департамент';
                summaryText.textContent = `Показано ${filteredRows.length} из ${visibilityRows.length} · Сортировка: ${sortLabel} (${state.sortDirection === 'asc' ? 'по возрастанию' : 'по убыванию'})`;
            }
            if (noResultsRow) {
                noResultsRow.classList.toggle('d-none', filteredRows.length > 0);
            }
            updateSortIndicators();
        }

        function cancelPhotoPreviewHide() {
            if (photoPreviewHideTimer != null) {
                window.clearTimeout(photoPreviewHideTimer);
                photoPreviewHideTimer = null;
            }
        }

        function hidePhotoPreview() {
            if (photoPreviewTimer != null) {
                window.clearTimeout(photoPreviewTimer);
                photoPreviewTimer = null;
            }
            cancelPhotoPreviewHide();
            if (photoPreview) photoPreview.hidden = true;
            if (photoPreviewImage) photoPreviewImage.removeAttribute('src');
        }

        function schedulePhotoPreviewHide() {
            cancelPhotoPreviewHide();
            photoPreviewHideTimer = window.setTimeout(() => {
                photoPreviewHideTimer = null;
                hidePhotoPreview();
            }, 300);
        }

        function showPhotoPreview(thumb) {
            hidePhotoPreview();
            if (!photoPreview || !photoPreviewImage || !thumb) return;
            const url = thumb.dataset.photoUrl || '';
            if (!url) return;
            photoPreviewTimer = window.setTimeout(() => {
                photoPreviewTimer = null;
                const rect = thumb.getBoundingClientRect();
                photoPreviewImage.src = url;
                photoPreview.hidden = false;
                const width = photoPreview.offsetWidth || 320;
                const height = photoPreview.offsetHeight || 220;
                const gap = 12;
                let left = rect.right + gap;
                if (left + width > window.innerWidth - gap) left = Math.max(gap, rect.left - width - gap);
                let top = rect.top + (rect.height - height) / 2;
                top = Math.max(gap, Math.min(top, window.innerHeight - height - gap));
                photoPreview.style.left = `${Math.round(left)}px`;
                photoPreview.style.top = `${Math.round(top)}px`;
            }, 500);
        }

        function bindPhotoPreview() {
            titlePhotoThumbs.forEach((thumb) => {
                thumb.addEventListener('mouseenter', () => {
                    cancelPhotoPreviewHide();
                    showPhotoPreview(thumb);
                });
                thumb.addEventListener('mouseleave', schedulePhotoPreviewHide);
                thumb.addEventListener('focus', () => showPhotoPreview(thumb));
                thumb.addEventListener('blur', hidePhotoPreview);
            });
            if (photoPreview) {
                photoPreview.addEventListener('mouseenter', cancelPhotoPreviewHide);
                photoPreview.addEventListener('mouseleave', hidePhotoPreview);
            }
            window.addEventListener('scroll', hidePhotoPreview, true);
            window.addEventListener('resize', hidePhotoPreview);
        }

        function bindFilterEvents() {
            [searchInput, departmentFilter, cityFilter, businessFilter, statusFilter, addressFilter, appealsMinFilter, showDeletedFilter]
                .filter(Boolean)
                .forEach((element) => {
                    element.addEventListener('input', applyState);
                    element.addEventListener('change', applyState);
                });

            if (applyFiltersBtn) {
                applyFiltersBtn.addEventListener('click', applyState);
            }

            if (resetFiltersBtn) {
                resetFiltersBtn.addEventListener('click', () => {
                    if (searchInput) searchInput.value = '';
                    if (departmentFilter) departmentFilter.value = '';
                    if (cityFilter) cityFilter.value = '';
                    if (businessFilter) businessFilter.value = '';
                    if (statusFilter) statusFilter.value = '';
                    if (addressFilter) addressFilter.value = '';
                    if (appealsMinFilter) appealsMinFilter.value = '';
                    if (showDeletedFilter) showDeletedFilter.checked = false;
                    applyState();
                });
            }

            sortHeaders.forEach((header) => {
                header.addEventListener('click', () => {
                    const nextKey = header.dataset.sortKey || 'department';
                    if (state.sortKey === nextKey) {
                        state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        state.sortKey = nextKey;
                        state.sortDirection = header.dataset.sortType === 'number' ? 'desc' : 'asc';
                    }
                    applyState();
                });
				header.addEventListener('keydown', (event) => {
					if (
						event.key !== 'Enter' &&
						event.key !== ' '
					) {
						return;
					}

					event.preventDefault();
					header.click();
				});
            });
        }

        populateFilters();
        bindFilterEvents();
        bindPhotoPreview();
        applyState();
    })();
</script>
</body>
</html>
