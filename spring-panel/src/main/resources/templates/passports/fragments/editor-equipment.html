<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="equipmentSection">      <div class="card passport-card mb-5 ops-section-card" id="equipmentSection">
        <div class="card-header d-flex justify-content-between align-items-center" data-section-header data-target="#equipmentBody">
          <span>Структура оборудования</span>
			<div class="d-flex gap-2">
				<button class="btn btn-sm btn-outline-secondary card-toggle-btn" type="button" data-section-toggle data-target="#equipmentBody" aria-expanded="false">Развернуть ▼</button>
				<button class="btn btn-sm btn-outline-primary" id="addEquipmentBtn" type="button">➕ Добавить оборудование</button>
			</div>
		</div>
        <div class="section-collapse" id="equipmentBody">
          <div class="card-body">
          <div class="alert alert-warning d-none" id="equipmentDisabledHint">Сохраните паспорт, чтобы управлять оборудованием.</div>
          <div id="equipmentContainer"></div>
          <div class="text-muted" id="equipmentEmptyText">Оборудование ещё не добавлено.</div>
		  </div>
        </div>
      </div></th:block>
