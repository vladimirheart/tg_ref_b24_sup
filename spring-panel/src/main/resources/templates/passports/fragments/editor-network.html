<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="networkCard">      <div class="card passport-card mb-4 ops-section-card" id="networkCard">
      <div class="card-header d-flex justify-content-between align-items-center" data-section-header data-target="#networkBody">
          <span>Информация о сети</span>
          <button class="btn btn-sm btn-outline-secondary card-toggle-btn" type="button" data-section-toggle data-target="#networkBody" aria-expanded="false">Развернуть ▼</button>
        </div>
        <div class="section-collapse" id="networkBody">
          <div class="card-body network-info">
            <div class="row g-4">
              <div class="col-12 col-xl-6">
                <h6 class="text-uppercase text-muted small mb-3">Внутренняя сеть</h6>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Внутренняя сеть</label>
                    <input type="text" class="form-control form-control-sm" id="internalNetworkInput" list="internalNetworkOptions" placeholder="Например, CorpLAN" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Туннель</label>
                    <input type="text" class="form-control form-control-sm" id="networkTunnelInput" placeholder="Например, VPN-01" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Оборудование (наименование и IP)</label>
                    <div class="network-equipment-summary" id="networkEquipmentSummary">
                      <div class="network-equipment-empty text-muted">Оборудование ещё не добавлено.</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12 col-xl-6">
                <h6 class="text-uppercase text-muted small mb-3">Провайдер</h6>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Наименование провайдера</label>
                    <input type="text" class="form-control form-control-sm" id="networkProviderInput" list="networkProviderOptions" placeholder="Например, Ростелеком" />
                  </div>
                  <div class="col-sm-6 col-xl-6">
                    <label class="form-label">Номер договора</label>
                    <input type="text" class="form-control form-control-sm" id="networkContractInput" list="networkContractOptions" placeholder="№ договора" />
                  </div>
                  <div class="col-sm-6 col-xl-6">
                    <label class="form-label">ID ресторана</label>
                    <input type="text" class="form-control form-control-sm" id="networkRestaurantIdInput" list="networkRestaurantOptions" placeholder="ID ресторана" />
                  </div>
                  <div class="col-sm-6 col-xl-6">
                    <label class="form-label">ЮЛ</label>
                    <input type="text" class="form-control form-control-sm" id="networkLegalEntityInput" list="networkLegalEntityOptions" placeholder="Юридическое лицо" />
                  </div>
                  <div class="col-sm-6 col-xl-6">
                    <label class="form-label">Телефон ТП провайдера</label>
                    <input type="text" class="form-control form-control-sm" id="networkSupportPhoneInput" list="networkSupportPhoneOptions" placeholder="Контакт ТП" />
                  </div>
                  <div class="col-sm-6 col-xl-6">
                    <label class="form-label">Скорость подключения</label>
                    <input type="text" class="form-control form-control-sm" id="networkSpeedInput" list="networkSpeedOptions" placeholder="Например, 100 Мбит/с" />
                  </div>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Параметры подключения к сети интернет</label>
                <textarea class="form-control form-control-sm" id="networkParamsInput" rows="3" placeholder="IP, VLAN, логин/пароль и т.д."></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Файлы</label>
                <form class="row g-2 align-items-end" id="networkFilesForm">
                  <div class="col-md-6 col-lg-4">
                    <input type="file" class="form-control form-control-sm" name="file" required />
                  </div>
                  <div class="col-md-2 col-lg-2">
                    <button class="btn btn-outline-primary btn-sm w-100" type="submit">Загрузить</button>
                  </div>
                </form>
                <div class="list-group list-group-flush mt-3" id="networkFilesList"></div>
                <div class="text-muted small" id="networkFilesEmptyText">Файлы ещё не добавлены.</div>
              </div>
            </div>
            <datalist id="internalNetworkOptions">
              <option th:each="value : ${parameterValues['network']}" th:value="${value}"></option>
            </datalist>
            <datalist id="networkProviderOptions">
              <option th:each="value : ${networkProviderOptions}" th:value="${value}"></option>
            </datalist>
            <datalist id="networkContractOptions">
              <option th:each="value : ${networkContractOptions}" th:value="${value}"></option>
            </datalist>
            <datalist id="networkRestaurantOptions">
              <option th:each="value : ${networkRestaurantIdOptions}" th:value="${value}"></option>
            </datalist>
            <datalist id="networkSupportPhoneOptions">
              <option th:each="value : ${networkSupportPhoneOptions}" th:value="${value}"></option>
            </datalist>
            <datalist id="networkSpeedOptions">
              <option th:each="value : ${networkSpeedOptions}" th:value="${value}"></option>
            </datalist>
            <datalist id="networkLegalEntityOptions">
              <option th:each="value : ${networkLegalEntityOptions}" th:value="${value}"></option>
            </datalist>
          </div>
        </div>
      </div></th:block>
