<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="basicInfoCard">      <div class="card passport-card mb-4 ops-section-card" id="basicInfoCard">
        <div class="card-header d-flex justify-content-between align-items-center" data-section-header data-target="#basicInfoBody">
          <span>Основная информация</span>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary card-toggle-btn" type="button" id="toggleItBlockBtn" aria-expanded="false">Раскрыть IT-блок</button>
            <button class="btn btn-sm btn-outline-secondary card-toggle-btn" type="button" data-section-toggle data-target="#basicInfoBody" aria-expanded="true">Свернуть ▲</button>
          </div>
        </div>
        <div class="section-collapse show" id="basicInfoBody">
          <div class="card-body">
          <div class="row g-3">
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Бизнес</label>
              <div class="searchable-select dropdown" data-select-id="businessSelect" data-force-custom-dropdown>
                <select class="form-select d-none" id="businessSelect">
                  <option value="">Не выбрано</option>
                  <option th:each="value : ${parameterValues['business']}" th:value="${value}" th:text="${value}"></option>
                </select>
                <div class="input-group input-group-sm">
                  <button class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    <span class="searchable-select-label">Не выбрано</span>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" data-action="add-parameter" data-param-type="business" data-target="businessSelect">+</button>
                </div>
                <div class="dropdown-menu p-2 passport-select-menu">
                  <input type="text" class="form-control form-control-sm mb-2 searchable-select-search" placeholder="Поиск..." />
                  <div class="searchable-select-options" role="listbox"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Департамент<span class="text-danger">*</span></label>
              <div class="searchable-select dropdown" data-select-id="departmentSelect" data-force-custom-dropdown>
                <select class="form-select d-none" id="departmentSelect">
                  <option value="">Не выбрано</option>
                  <option th:each="value : ${parameterValues['department']}" th:value="${value}" th:text="${value}"></option>
                </select>
                <div class="input-group input-group-sm">
                  <button class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    <span class="searchable-select-label">Не выбрано</span>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" data-action="add-parameter" data-param-type="department" data-target="departmentSelect">+</button>
                </div>
                <div class="dropdown-menu p-2 passport-select-menu">
                  <input type="text" class="form-control form-control-sm mb-2 searchable-select-search" placeholder="Поиск..." />
                  <div class="searchable-select-options" role="listbox"></div>
                </div>
              </div>
              <div class="form-text">Список департаментов зависит от выбранного бизнеса.</div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Тип партнёра</label>
              <div class="searchable-select dropdown" data-select-id="partnerTypeSelect" data-force-custom-dropdown>
                <select class="form-select d-none" id="partnerTypeSelect">
                  <option value="">Не выбрано</option>
                  <option th:each="value : ${parameterValues['partner_type']}" th:value="${value}" th:text="${value}"></option>
                </select>
                <div class="input-group input-group-sm">
                  <button class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    <span class="searchable-select-label">Не выбрано</span>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" data-action="add-parameter" data-param-type="partner_type" data-target="partnerTypeSelect">+</button>
                </div>
                <div class="dropdown-menu p-2 passport-select-menu">
                  <input type="text" class="form-control form-control-sm mb-2 searchable-select-search" placeholder="Поиск..." />
                  <div class="searchable-select-options" role="listbox"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Страна</label>
              <div class="searchable-select dropdown" data-select-id="countrySelect" data-force-custom-dropdown>
                <select class="form-select d-none" id="countrySelect">
                  <option value="">Не выбрано</option>
                  <option th:each="value : ${parameterValues['country']}" th:value="${value}" th:text="${value}"></option>
                </select>
                <div class="input-group input-group-sm">
                  <button class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    <span class="searchable-select-label">Не выбрано</span>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" data-action="add-parameter" data-param-type="country" data-target="countrySelect">+</button>
                </div>
                <div class="dropdown-menu p-2 passport-select-menu">
                  <input type="text" class="form-control form-control-sm mb-2 searchable-select-search" placeholder="Поиск..." />
                  <div class="searchable-select-options" role="listbox"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Юридическое лицо</label>
              <div class="searchable-select dropdown" data-select-id="legalEntitySelect" data-force-custom-dropdown>
                <select class="form-select d-none" id="legalEntitySelect">
                  <option value="">Не выбрано</option>
                  <option th:each="value : ${parameterValues['legal_entity']}" th:value="${value}" th:text="${value}"></option>
                </select>
                <div class="input-group input-group-sm">
                  <button class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    <span class="searchable-select-label">Не выбрано</span>
                  </button>
                  <button class="btn btn-outline-secondary" type="button" data-action="add-parameter" data-param-type="legal_entity" data-target="legalEntitySelect">+</button>
                </div>
                <div class="dropdown-menu p-2 passport-select-menu">
                  <input type="text" class="form-control form-control-sm mb-2 searchable-select-search" placeholder="Поиск..." />
                  <div class="searchable-select-options" role="listbox"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Город</label>
              <input type="text" id="cityInput" class="form-control form-control-sm" list="citiesList" placeholder="Например, Москва" />
              <datalist id="citiesList">
                <option th:each="value : ${cities}" th:value="${value}"></option>
              </datalist>
            </div>
            <div class="col-12">
              <label class="form-label">Адрес локации</label>
              <input type="text" class="form-control form-control-sm" id="locationAddressInput" placeholder="Например, г. Волгоград ул. Ленина, 1" data-no-auto-expand="true" />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Статус</label>
              <div class="searchable-select dropdown" data-select-id="statusSelect" data-force-custom-dropdown>
                <select class="form-select d-none" id="statusSelect">
                  <option th:each="value : ${statuses}" th:value="${value}" th:text="${value}"></option>
                </select>
                <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                  <span class="searchable-select-label">Не выбрано</span>
                </button>
                <div class="dropdown-menu p-2 passport-select-menu">
                  <input type="text" class="form-control form-control-sm mb-2 searchable-select-search" placeholder="Поиск..." />
                  <div class="searchable-select-options" role="listbox"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Номер телефона объекта</label>
              <input type="text" class="form-control form-control-sm" id="itObjectPhoneInput" placeholder="+7..." />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Управляющий</label>
              <input type="text" class="form-control form-control-sm" id="itManagerNameInput" placeholder="ФИО управляющего" />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Телефон управляющего</label>
              <input type="text" class="form-control form-control-sm" id="itManagerPhoneInput" placeholder="+7..." />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Дата запуска</label>
              <input type="date" class="form-control form-control-sm" id="startDateInput" />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Дата закрытия</label>
              <input type="date" class="form-control form-control-sm" id="endDateInput" />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Дата приостановки</label>
              <input type="date" class="form-control form-control-sm" id="suspensionDateInput" />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Дата разморозки</label>
              <input type="date" class="form-control form-control-sm" id="resumeDateInput" />
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Общее время работы</label>
              <div class="form-control-plaintext fw-semibold" id="totalTimeDisplay">—</div>
            </div>
            <div class="col-sm-6 col-xl-4">
              <label class="form-label">Время в статусах приостановки</label>
              <div class="form-control-plaintext fw-semibold" id="statusHistoryTotal">—</div>
            </div>
            <div class="col-12">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label mb-0" for="statusHistoryCollapse">История приостановок</label>
                <button class="btn btn-sm btn-outline-secondary d-none" type="button" id="statusHistoryToggle" data-bs-toggle="collapse" data-bs-target="#statusHistoryCollapse" aria-expanded="false">Показать ▼</button>
              </div>
              <div class="text-muted small" id="statusHistoryEmpty">История ещё не добавлена.</div>
              <div class="collapse mt-2" id="statusHistoryCollapse">
                <div class="status-history-list" id="statusHistoryList"></div>
              </div>
            </div>
            <div class="col-12 col-lg-6 d-none" id="statusTaskContainer">
              <label class="form-label">Связанная задача<span class="text-danger">*</span></label>
              <div class="select-search-wrapper">
                <input type="text" class="form-control form-control-sm mb-2 select-search-input" data-select-target="statusTaskSelect" id="statusTaskSearchInput" placeholder="Поиск по номеру или названию" autocomplete="off" data-no-auto-resize="true" data-unsaved-ignore="true" />
                <select class="form-select form-select-sm" id="statusTaskSelect">
                  <option value="">Не выбрано</option>
                </select>
              </div>
              <div class="form-text" id="statusTaskHint">Выберите задачу, отражающую текущее состояние объекта.</div>
              <div class="small mt-2 text-muted" id="statusTaskInfo"></div>
            </div>
          </div>
          <div class="mt-4 it-block d-none" id="itBlock" data-user-collapsed="true">
            <h6 class="text-uppercase text-muted small mb-3">IT-блок</h6>
            <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Оборудование и IP-адреса</label>
              <div class="it-equipment-list" id="itEquipmentList">
                <div class="it-equipment-empty">Оборудование ещё не добавлено.</div>
              </div>
            </div>
              <div class="col-12 col-lg-6">
                <label class="form-label">Адрес сервера iiko</label>
                <select class="form-select form-select-sm" id="iikoServerSelect">
                  <option value="">Не выбрано</option>
                  <option th:each="option : ${iikoServerOptions}" th:value="${option}" th:text="${option}"></option>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Затраченное время по обращениям</label>
                <div class="form-control-plaintext fw-semibold" id="caseTimeDisplay">—</div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Затраченное время по задачам</label>
                <div class="form-control-plaintext fw-semibold" id="taskTimeDisplay">—</div>
              </div>
            </div>
          </div>
          </div>
        </div>
      </div></th:block>
