<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каналы — iguana</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="with-sidebar sidebar-pinned"
		  data-ui-page="channels"
		  data-ui-density="compact">

	<div th:replace="~{fragments/navbar :: navbar('channels')}"></div>

	<main class="main-content container-fluid">
		<div class="page-shell admin-directory-shell">

			<div class="page-header-card page-header-card--compact admin-directory-header">
				<span class="page-kicker">Администрирование</span>

				<h1 class="page-title">Каналы</h1>

				<p class="page-subtitle">
					Подключённые каналы, платформы, боты
					и текущее состояние маршрутизации.
				</p>
			</div>
    <div class="card admin-table-card">
		<div class="table-responsive admin-table-shell">
			<table class="table align-middle admin-table">
				<thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Платформа</th>
                    <th>Бот</th>
                    <th>Активен</th>
                    <th>Описание</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(channels)}">
                    <td colspan="6" class="admin-empty-cell">Каналы отсутствуют</td>
                </tr>
                <tr th:each="channel : ${channels}">
                    <td th:text="${channel.id}"></td>
                    <td>
                        <div class="admin-primary-value" th:text="${channel.channelName}"></div>
                    </td>
                    <td>
                        <span class="admin-platform-label" th:text="${channel.platform} ?: 'telegram'"></span>
                    </td>
                    <td>
                        <div class="admin-primary-value" th:text="${channel.botName} ?: '—'"></div>
                        <div class="admin-secondary-value" th:text="${channel.botUsername} ?: '—'"></div>
                    </td>
                    <td>
                        <span class="admin-status-badge"
							  th:classappend="${channel.active}
								  ? ' admin-status-badge--active'
								  : ' admin-status-badge--inactive'"
							  th:text="${channel.active} ? 'Да' : 'Нет'"></span>
                    </td>
                    <td>
                        <span class="admin-secondary-value" th:text="${channel.description} ?: '—'"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
