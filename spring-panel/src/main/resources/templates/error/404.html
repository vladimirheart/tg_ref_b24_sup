<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена — iguana</title>
    <link rel="icon"
      type="image/png"
      sizes="32x32"
      th:href="@{/favicon-32x32.png?v=2}">

	<link rel="icon"
      type="image/png"
      sizes="16x16"
      th:href="@{/favicon-16x16.png?v=2}">

	<link rel="shortcut icon"
      type="image/x-icon"
      th:href="@{/favicon.ico?v=2}">

	<link rel="apple-touch-icon"
      sizes="180x180"
      th:href="@{/favicon-180x180.png?v=2}">
    <link rel="stylesheet" href="/vendor/bootstrap/5.3.3/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-wrapper d-flex align-items-center" data-ui-page="public">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
            <div class="card auth-card">
                <div class="card-body p-4 p-lg-5 text-center">
                    <div class="error-status-mark error-status-mark--info mb-4" aria-hidden="true">
						404
					</div>
                    <h1 class="h4 mb-2">Страница не найдена</h1>
                    <p class="text-muted mb-4">Проверьте адрес или вернитесь на главную панель. Если вы открывали аналитику или форму из старых закладок, ссылка могла устареть.</p>
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                        <a th:href="@{/}" class="btn btn-primary btn-rounded">На главную</a>
                        <a th:href="@{/login}" class="btn btn-outline-secondary btn-rounded">Войти снова</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
