<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Доступ запрещён</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-wrapper d-flex align-items-center" data-ui-page="public">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
            <div class="card auth-card">
                <div class="card-body p-4 p-lg-5 text-center">
                    <div class="error-status-mark error-status-mark--warning mb-4" aria-hidden="true">
                        403
                    </div>

                    <h1 class="h4 mb-2">Недостаточно прав</h1>

                    <p class="text-muted mb-4">
                        У вас нет доступа к этой странице.
                        Обратитесь к администратору, чтобы получить необходимые права.
                    </p>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                        <a th:href="@{/post-login}" class="btn btn-primary btn-rounded">
                            Перейти на доступную страницу
                        </a>

                        <a th:href="@{/logout}" class="btn btn-outline-secondary btn-rounded">
                            Выйти из аккаунта
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
