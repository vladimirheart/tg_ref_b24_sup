<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="uiHead">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          th:href="@{/favicon-32x32.png?v=3}">

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          th:href="@{/favicon-16x16.png?v=3}">

    <link rel="shortcut icon"
          type="image/x-icon"
          th:href="@{/favicon.ico?v=3}">

    <link rel="apple-touch-icon"
          sizes="180x180"
          th:href="@{/favicon-180x180.png?v=3}">

    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/1.10.5/bootstrap-icons.css}">

    <style data-ui-first-paint-critical>
        .page-header-title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem;
            min-width: 0;
        }
        .page-header-title-row .page-title { min-width: 0; }
        .page-header-title-row .page-kicker,
        .page-header-title-row .page-title { margin-top: 0; margin-bottom: 0; }

        html.iguana-ui-first-paint .page-header-card .page-subtitle:not([data-no-disclosure]) {
            display: none !important;
        }

        @supports selector(.page-header-card:has(> .page-title)) {
            html.iguana-ui-first-paint .page-header-card:has(> .page-kicker):has(> .page-title),
            html.iguana-ui-first-paint .page-header-card :not(.page-header-title-row):has(> .page-kicker):has(> .page-title) {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                column-gap: 0.45rem;
                row-gap: 0.2rem;
                min-width: 0;
            }

            html.iguana-ui-first-paint .page-header-card:has(> .page-kicker):has(> .page-title) > .page-kicker,
            html.iguana-ui-first-paint .page-header-card:has(> .page-kicker):has(> .page-title) > .page-title,
            html.iguana-ui-first-paint .page-header-card :not(.page-header-title-row):has(> .page-kicker):has(> .page-title) > .page-kicker,
            html.iguana-ui-first-paint .page-header-card :not(.page-header-title-row):has(> .page-kicker):has(> .page-title) > .page-title {
                margin-top: 0;
                margin-bottom: 0;
            }
        }

        html.dialog-list-only-prepaint body[data-ui-page='dialogs'] .dialogs-extra-section {
            display: none !important;
        }
    </style>
    <script>
        document.documentElement.classList.add('iguana-ui-first-paint');
    </script>

    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
    <script th:inline="javascript">
        window.__IGUANA_UI_PREFS_BOOTSTRAP__ = /*[[${uiPreferencesBootstrap}]]*/ {};
        window.__IGUANA_UI_PREFS_META__ = {
            syncEnabled: /*[[${uiPreferencesSyncEnabled}]]*/ false,
            endpoint: /*[[@{/profile/ui-preferences}]]*/ '/profile/ui-preferences'
        };
    </script>
    <script th:src="@{/js/ui-preferences.js(v='20260924-01-273-r8')}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/ui-config.js}"></script>
    <script th:src="@{/js/modal-resize.js}" defer></script>
    <script th:src="@{/js/ui-disclosure.js}" defer></script>
    <script th:src="@{/js/ellipsis-reveal.js(v='20260924-01-272-s12')}" defer></script>
</th:block>
