<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-XSRF-TOKEN'}" />
  <title>Проекты — iguana</title>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png?v=2}">
  <link href="/vendor/bootstrap/5.3.3/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <th:block th:replace="~{fragments/ui-head :: uiHead}"></th:block>
  <link th:href="@{/css/style.css(v='20261127-modules-330')}" rel="stylesheet">
  <link th:href="@{/css/app.css(v='20261127-modules-330')}" rel="stylesheet">
  <link th:href="@{/css/sidebar.css(v='20261119-refined-r1')}" rel="stylesheet">
  <link th:href="@{/css/project-settings.css(v='20261126-project-members-r1')}" rel="stylesheet">
</head>
<body class="with-sidebar sidebar-pinned" data-ui-page="projects">
  <div th:replace="~{fragments/navbar :: navbar('projects')}"></div>
  <datalist id="projectUsersList"><option th:each="u : ${users}" th:value="${u.username}" th:label="${u.fullName != null and !#strings.isEmpty(u.fullName) ? u.fullName + ' · ' + u.username : u.username}"></option></datalist>

  <main class="main-content container-fluid py-4 page-shell projects-page-shell ops-page-shell">
    <div class="page-header-card projects-header-card ops-list-shell">
      <div class="projects-header-row ops-page-head">
        <div>
          <span class="page-kicker">Рабочий контур</span>
          <h1 class="page-title">Проекты</h1>
          <p class="page-subtitle mb-0">Проекты, участники и связанные задачи.</p>
        </div>
        <div class="ops-page-actions">
          <a class="btn btn-outline-secondary" th:href="@{/tasks}"><i class="bi bi-list-task"></i><span>Задачи</span></a>
          <button id="createProjectBtn" data-work-create="PROJECT" disabled class="btn btn-primary" type="button"><i class="bi bi-plus-lg"></i><span>Создать проект</span></button>
        </div>
      </div>

      <nav class="work-management-tabs" aria-label="Раздел задач">
        <a class="work-management-tab" th:href="@{/tasks}">Список задач</a>
        <a class="work-management-tab active" th:href="@{/projects}" aria-current="page">Проекты</a>
      </nav>

      <div class="projects-metrics-row">
        <span class="projects-metric-chip projects-metric-chip--primary">Всего <strong id="projectsTotal">0</strong></span>
        <span class="projects-metric-chip">Активные <strong id="projectsActive">0</strong></span>
        <span class="projects-metric-chip">На паузе <strong id="projectsPaused">0</strong></span>
        <label class="projects-archive-toggle"><input id="includeArchivedProjects" type="checkbox"> Показать архивные</label>
      </div>
    </div>

    <div id="projectsGrid" class="projects-grid" aria-live="polite">
      <div class="projects-empty-state">Загрузка проектов…</div>
    </div>
    <section th:replace="~{fragments/shared-work-access :: moduleAccess}"></section>

    <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div><span id="projectModalMeta" class="text-muted small">Новый проект</span><h5 class="modal-title" id="projectModalTitle">Новый проект</h5></div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <nav class="nav nav-tabs project-settings-tabs" role="tablist" aria-label="Настройки проекта">
              <button class="nav-link active" id="project-info-tab" data-bs-toggle="tab" data-bs-target="#project-info" role="tab" aria-controls="project-info" aria-selected="true" type="button">Сведения</button>
              <button class="nav-link" id="project-members-tab" data-bs-toggle="tab" data-bs-target="#project-members" role="tab" aria-controls="project-members" aria-selected="false" tabindex="-1" type="button">Участники <span id="projectMemberCount" class="badge text-bg-secondary" hidden></span></button>
            </nav>
            <div class="tab-content">
            <section id="project-info" class="tab-pane active" role="tabpanel" aria-labelledby="project-info-tab" tabindex="0">
            <form id="projectForm" class="row g-3 mt-0">
              <input type="hidden" name="id">
              <div class="col-12"><label class="form-label" for="projectName">Название</label><input id="projectName" class="form-control" name="name" required></div>
              <div class="col-sm-6"><label class="form-label" for="projectLead">Руководитель</label><input id="projectLead" class="form-control" name="lead_identity" list="projectUsersList" placeholder="Выберите сотрудника"><div class="form-text">Участие руководителя настраивается на вкладке «Участники».</div></div>
              <div class="col-sm-6"><label class="form-label" for="projectStatus">Статус</label><select id="projectStatus" class="form-select" name="status"><option value="active">Активный</option><option value="paused">Пауза</option><option value="done">Завершён</option></select></div>
              <div class="col-12"><label class="form-label" for="projectDescription">Описание</label><textarea id="projectDescription" class="form-control" name="description" rows="3" placeholder="Цель и важные сведения о проекте"></textarea></div>
              <div class="col-12"><details class="project-settings-advanced">
                <summary>Дополнительно</summary>
                <label class="form-label mt-3" for="projectKey">Код проекта</label><input id="projectKey" class="form-control" name="project_key" placeholder="Назначается автоматически">
                <button id="archiveProjectBtn" data-work-write disabled class="btn btn-sm btn-outline-danger mt-3" type="button" hidden>Архивировать проект</button>
              </details></div>
            </form>
            </section>
            <section id="project-members" class="tab-pane" role="tabpanel" aria-labelledby="project-members-tab" tabindex="0">
              <section th:replace="~{fragments/shared-work-access :: objectAccess('PROJECT')}"></section>
            </section>
            </div>
          </div>
          <div class="modal-footer">
            <span id="projectSaveHint" class="small text-muted me-auto" role="status" aria-live="polite"></span>
            <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Закрыть</button>
            <button id="saveProjectBtn" data-work-write disabled class="btn btn-primary" type="button">Сохранить</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/5.3.3/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script th:src="@{/js/modal-helpers.js}"></script>
  <script th:src="@{/js/shared-work-access.js?v=20261127-work-access-r328}"></script>
  <script th:src="@{/js/projects.js?v=20261127-work-access-r328}"></script>
  <script th:src="@{/js/modal-transitions.js}"></script>
</body>
</html>
