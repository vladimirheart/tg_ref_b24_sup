x-panel-build: &panel-build
  image: ${IGUANA_PANEL_IMAGE:-iguana-panel:local}
  build:
    context: .
    dockerfile: docker/panel.Dockerfile

x-panel-environment: &panel-environment
  APP_DB_MODE: postgresql
  APP_HTTP_PORT: 8080
  APP_INTEGRATION_TRANSPORT_MODE: rabbitmq
  APP_COORDINATION_MODE: redis
  APP_STORAGE_OBJECT_MODE: s3
  APP_COORDINATION_REQUIRED_FOR_POSTGRESQL: "true"
  APP_STORAGE_OBJECT_REQUIRED_FOR_POSTGRESQL: "true"
  APP_UI_EVENT_FANOUT_MODE: redis
  APP_UI_EVENT_FANOUT_CHANNEL: ${APP_UI_EVENT_FANOUT_CHANNEL:-iguana:ui-events:v1}
  APP_INTEGRATION_OUTBOX_DISPATCH_INTERVAL_MS: ${APP_INTEGRATION_OUTBOX_DISPATCH_INTERVAL_MS:-250}
  PANEL_UI_EVENT_OUTBOX_WATCH_INTERVAL_MS: ${PANEL_UI_EVENT_OUTBOX_WATCH_INTERVAL_MS:-250}
  # Panel starts one isolated runtime per active channel; this scales beyond static compose profiles.
  APP_BOT_AUTO_START_ENABLED: ${APP_BOT_AUTO_START_ENABLED:-true}
  APP_BOT_LAUNCH_MODE: jar
  APP_BOT_EXECUTABLE_JAR_TELEGRAM: ${APP_BOT_EXECUTABLE_JAR_TELEGRAM:-dist/bot-telegram-runtime.jar}
  APP_BOT_EXECUTABLE_JAR_VK: ${APP_BOT_EXECUTABLE_JAR_VK:-dist/bot-vk-runtime.jar}
  APP_BOT_EXECUTABLE_JAR_MAX: ${APP_BOT_EXECUTABLE_JAR_MAX:-dist/bot-max-runtime.jar}
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IGUANA_POSTGRES_DB:-iguana}
  SPRING_DATASOURCE_USERNAME: ${IGUANA_POSTGRES_USER:-iguana}
  SPRING_DATASOURCE_PASSWORD: ${IGUANA_POSTGRES_PASSWORD:-iguana}
  # Dynamic channels are separate JVMs; bound each pool so channel growth cannot exhaust PostgreSQL.
  APP_DB_MAX_POOL_SIZE: ${APP_POSTGRES_POOL_MAX_SIZE:-6}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${IGUANA_RABBITMQ_USER:-iguana}
  SPRING_RABBITMQ_PASSWORD: ${IGUANA_RABBITMQ_PASSWORD:-iguana}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${IGUANA_REDIS_PASSWORD:-iguana-redis}
  APP_STORAGE_OBJECT_BUCKET: ${APP_STORAGE_OBJECT_BUCKET:-iguana}
  APP_STORAGE_OBJECT_REGION: ${APP_STORAGE_OBJECT_REGION:-us-east-1}
  APP_STORAGE_OBJECT_KEY_PREFIX: ${APP_STORAGE_OBJECT_KEY_PREFIX:-iguana}
  APP_STORAGE_OBJECT_ENDPOINT: http://minio:9000
  APP_STORAGE_OBJECT_ACCESS_KEY: ${APP_STORAGE_OBJECT_ACCESS_KEY:-iguana-minio}
  APP_STORAGE_OBJECT_SECRET_KEY: ${APP_STORAGE_OBJECT_SECRET_KEY:-iguana-minio-secret}
  APP_STORAGE_OBJECT_PATH_STYLE_ACCESS: "true"
  APP_STORAGE_OBJECT_LEGACY_LOCAL_FALLBACK_ENABLED: ${APP_STORAGE_OBJECT_LEGACY_LOCAL_FALLBACK_ENABLED:-true}
  APP_STORAGE_ATTACHMENTS: /opt/iguana/attachments
  APP_STORAGE_KNOWLEDGE_BASE: /opt/iguana/attachments/knowledge_base
  APP_STORAGE_AVATARS: /opt/iguana/attachments/avatars
  APP_STORAGE_WEBFORMS: /opt/iguana/attachments/forms
  APP_BOT_DATABASE_DIR: /opt/iguana/bot_databases
  APP_PANEL_LOG_DIR: /opt/iguana/logs
  SHARED_CONFIG_DIR: /opt/iguana/config/shared
  APP_ADMIN_REPOSITORY_ROOT: /opt/iguana
  APP_INTERNAL_BOT_API_TOKEN: ${APP_INTERNAL_BOT_API_TOKEN:-change-me}
  APP_INTERNAL_BOT_API_SIGNATURE_SECRET: ${APP_INTERNAL_BOT_API_SIGNATURE_SECRET:-}
  APP_INTERNAL_BOT_API_REQUIRE_REQUEST_SIGNATURE: ${APP_INTERNAL_BOT_API_REQUIRE_REQUEST_SIGNATURE:-true}
  APP_SECURITY_REMEMBER_ME_KEY: ${APP_SECURITY_REMEMBER_ME_KEY:-change-me}
  APP_SECURITY_BOOTSTRAP_ADMIN_USERNAME: ${APP_SECURITY_BOOTSTRAP_ADMIN_USERNAME:-}
  APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:-}
  MONITORING_CREDENTIALS_MASTER_KEY: ${MONITORING_CREDENTIALS_MASTER_KEY:-}
  IGUANA_LEGACY_SQLITE_AUTO_IMPORT: ${IGUANA_LEGACY_SQLITE_AUTO_IMPORT:-false}

x-panel-volumes: &panel-volumes
  - ${IGUANA_SHARED_CONFIG_DIR:-./config/shared}:/opt/iguana/config/shared
  - ${IGUANA_ATTACHMENTS_DIR:-./attachments}:/opt/iguana/attachments
  - ${IGUANA_LOGS_DIR:-./logs}:/opt/iguana/logs
  - ${IGUANA_BOT_DATABASES_DIR:-./bot_databases}:/opt/iguana/bot_databases

# Legacy SQLite sources are exposed only to the one-shot migrator. Operators
# stage immutable copies here; web and worker roles never receive this mount.
x-db-migrate-volumes: &db-migrate-volumes
  - ${IGUANA_SHARED_CONFIG_DIR:-./config/shared}:/opt/iguana/config/shared:ro
  - ${IGUANA_ATTACHMENTS_DIR:-./attachments}:/opt/iguana/attachments:ro
  - ${IGUANA_LOGS_DIR:-./logs}:/opt/iguana/logs
  - ${IGUANA_LEGACY_SQLITE_STAGING_DIR:-./.tmp/legacy-sqlite-import}:/opt/iguana/legacy-sqlite:ro
  - ${IGUANA_LEGACY_SQLITE_STAGING_DIR:-./.tmp/legacy-sqlite-import}/bot_databases:/opt/iguana/bot_databases:ro

x-panel-infra-depends: &panel-infra-depends
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

x-panel-healthcheck: &panel-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${APP_POSTGRES_MAX_CONNECTIONS:-150}"]
    environment:
      POSTGRES_DB: ${IGUANA_POSTGRES_DB:-iguana}
      POSTGRES_USER: ${IGUANA_POSTGRES_USER:-iguana}
      POSTGRES_PASSWORD: ${IGUANA_POSTGRES_PASSWORD:-iguana}
    ports:
      - "${APP_POSTGRES_BIND_HOST:-127.0.0.1}:${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - iguana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IGUANA_POSTGRES_USER:-iguana} -d ${IGUANA_POSTGRES_DB:-iguana}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${IGUANA_RABBITMQ_USER:-iguana}
      RABBITMQ_DEFAULT_PASS: ${IGUANA_RABBITMQ_PASSWORD:-iguana}
    ports:
      - "${APP_RABBITMQ_AMQP_BIND_HOST:-127.0.0.1}:${APP_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${APP_RABBITMQ_HTTP_BIND_HOST:-127.0.0.1}:${APP_RABBITMQ_HTTP_PORT:-15672}:15672"
    volumes:
      - iguana-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${IGUANA_REDIS_PASSWORD:-iguana-redis}
    ports:
      - "${APP_REDIS_BIND_HOST:-127.0.0.1}:${APP_REDIS_PORT:-6379}:6379"
    volumes:
      - iguana-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${IGUANA_REDIS_PASSWORD:-iguana-redis} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_STORAGE_OBJECT_ACCESS_KEY:-iguana-minio}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_OBJECT_SECRET_KEY:-iguana-minio-secret}
    ports:
      - "${APP_STORAGE_OBJECT_BIND_HOST:-127.0.0.1}:${APP_STORAGE_OBJECT_PORT:-9000}:9000"
      - "${APP_STORAGE_OBJECT_CONSOLE_BIND_HOST:-127.0.0.1}:${APP_STORAGE_OBJECT_CONSOLE_PORT:-9001}:9001"
    volumes:
      - iguana-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 ${APP_STORAGE_OBJECT_ACCESS_KEY:-iguana-minio} ${APP_STORAGE_OBJECT_SECRET_KEY:-iguana-minio-secret};
        do sleep 2; done;
        mc mb --ignore-existing local/${APP_STORAGE_OBJECT_BUCKET:-iguana};
        mc anonymous set none local/${APP_STORAGE_OBJECT_BUCKET:-iguana} || true

  db-migrate:
    <<: *panel-build
    restart: "no"
    depends_on:
      <<: *panel-infra-depends
    environment:
      <<: *panel-environment
      APP_RUNTIME_ROLE: db-migrate
      APP_RUNTIME_EXIT_AFTER_MIGRATION: "true"
      APP_INSTANCE_ID: db-migrate
      APP_DB_PANEL_RUNTIME: /opt/iguana/legacy-sqlite/panel_runtime.db
      APP_DB_PANEL_IDENTITY: /opt/iguana/legacy-sqlite/panel_identity.db
      APP_DB_MONITORING: /opt/iguana/legacy-sqlite/monitoring.db
      APP_DB_BOT_RUNTIME: /opt/iguana/legacy-sqlite/bot_runtime.db
      APP_DB_CLIENTS: /opt/iguana/legacy-sqlite/clients.db
      APP_DB_KNOWLEDGE: /opt/iguana/legacy-sqlite/knowledge_base.db
      APP_DB_OBJECTS: /opt/iguana/legacy-sqlite/objects.db
      APP_BOT_DATABASE_DIR: /opt/iguana/bot_databases
    volumes: *db-migrate-volumes

  ops-worker:
    <<: *panel-build
    restart: unless-stopped
    depends_on:
      <<: *panel-infra-depends
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *panel-environment
      APP_RUNTIME_ROLE: ops-worker
      APP_RUNTIME_EXIT_AFTER_MIGRATION: "false"
    expose:
      - "8080"
    volumes: *panel-volumes
    healthcheck: *panel-healthcheck

  # Exactly one supervisor owns all dynamically configured bot runtimes.
  # Do not scale this service: each active channel maps to one child process.
  bot-runner:
    <<: *panel-build
    restart: unless-stopped
    depends_on:
      <<: *panel-infra-depends
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *panel-environment
      APP_RUNTIME_ROLE: bot-runner
      APP_RUNTIME_EXIT_AFTER_MIGRATION: "false"
      APP_INTERNAL_BOT_API_BASE_URL: http://panel-web:8080
    expose:
      - "8080"
    volumes: *panel-volumes
    healthcheck: *panel-healthcheck

  panel-web:
    <<: *panel-build
    restart: unless-stopped
    depends_on:
      <<: *panel-infra-depends
      db-migrate:
        condition: service_completed_successfully
      ops-worker:
        condition: service_healthy
    environment:
      <<: *panel-environment
      APP_RUNTIME_ROLE: panel-web
      APP_RUNTIME_EXIT_AFTER_MIGRATION: "false"
    expose:
      - "8080"
    volumes: *panel-volumes
    healthcheck: *panel-healthcheck

  # Stable loopback ingress preserves the historical 127.0.0.1:8080 access
  # without publishing a port from every scalable panel-web replica.
  panel-direct:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      panel-web:
        condition: service_healthy
    ports:
      - "${APP_PANEL_BIND_HOST:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/panel-direct.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  bot-telegram:
    # Retained only for emergency rollback; dynamic bot-runner owns production channels.
    profiles: ["legacy-static-bots-disabled"]
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
      args:
        BOT_MODULE: bot-telegram
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      panel-web:
        condition: service_healthy
    environment:
      APP_DB_MODE: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IGUANA_POSTGRES_DB:-iguana}
      SPRING_DATASOURCE_USERNAME: ${IGUANA_POSTGRES_USER:-iguana}
      SPRING_DATASOURCE_PASSWORD: ${IGUANA_POSTGRES_PASSWORD:-iguana}
      APP_INTEGRATION_TRANSPORT_MODE: rabbitmq
      APP_COORDINATION_MODE: redis
      APP_STORAGE_OBJECT_MODE: s3
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${IGUANA_RABBITMQ_USER:-iguana}
      SPRING_RABBITMQ_PASSWORD: ${IGUANA_RABBITMQ_PASSWORD:-iguana}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${IGUANA_REDIS_PASSWORD:-iguana-redis}
      APP_PANEL_INTERNAL_API_BASE_URL: http://panel-web:8080
      APP_PANEL_INTERNAL_API_TOKEN: ${APP_INTERNAL_BOT_API_TOKEN:-change-me}
      APP_PANEL_INTERNAL_API_SIGNATURE_SECRET: ${APP_INTERNAL_BOT_API_SIGNATURE_SECRET:-}
      APP_PANEL_INTERNAL_API_REQUEST_SIGNING_ENABLED: "true"
      APP_STORAGE_OBJECT_BUCKET: ${APP_STORAGE_OBJECT_BUCKET:-iguana}
      APP_STORAGE_OBJECT_REGION: ${APP_STORAGE_OBJECT_REGION:-us-east-1}
      APP_STORAGE_OBJECT_KEY_PREFIX: ${APP_STORAGE_OBJECT_KEY_PREFIX:-iguana}
      APP_STORAGE_OBJECT_ENDPOINT: http://minio:9000
      APP_STORAGE_OBJECT_ACCESS_KEY: ${APP_STORAGE_OBJECT_ACCESS_KEY:-iguana-minio}
      APP_STORAGE_OBJECT_SECRET_KEY: ${APP_STORAGE_OBJECT_SECRET_KEY:-iguana-minio-secret}
      APP_STORAGE_OBJECT_PATH_STYLE_ACCESS: "true"
      APP_STORAGE_ATTACHMENTS: /opt/iguana/attachments
      APP_STORAGE_WEBFORMS: /opt/iguana/attachments/forms
      APP_BOT_LOG_DIR: /opt/iguana/logs
      APP_BOT_LOG_PATH: /opt/iguana/logs/bot-telegram.log
      SHARED_CONFIG_DIR: /opt/iguana/config/shared
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GROUP_CHAT_ID: ${GROUP_CHAT_ID:-0}
    volumes:
      - ${IGUANA_SHARED_CONFIG_DIR:-./config/shared}:/opt/iguana/config/shared
      - ${IGUANA_ATTACHMENTS_DIR:-./attachments}:/opt/iguana/attachments
      - ${IGUANA_LOGS_DIR:-./logs}:/opt/iguana/logs

  bot-vk:
    profiles: ["legacy-static-bots-disabled"]
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
      args:
        BOT_MODULE: bot-vk
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      panel-web:
        condition: service_healthy
    environment:
      APP_DB_MODE: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IGUANA_POSTGRES_DB:-iguana}
      SPRING_DATASOURCE_USERNAME: ${IGUANA_POSTGRES_USER:-iguana}
      SPRING_DATASOURCE_PASSWORD: ${IGUANA_POSTGRES_PASSWORD:-iguana}
      APP_INTEGRATION_TRANSPORT_MODE: rabbitmq
      APP_COORDINATION_MODE: redis
      APP_STORAGE_OBJECT_MODE: s3
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${IGUANA_RABBITMQ_USER:-iguana}
      SPRING_RABBITMQ_PASSWORD: ${IGUANA_RABBITMQ_PASSWORD:-iguana}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${IGUANA_REDIS_PASSWORD:-iguana-redis}
      APP_PANEL_INTERNAL_API_BASE_URL: http://panel-web:8080
      APP_PANEL_INTERNAL_API_TOKEN: ${APP_INTERNAL_BOT_API_TOKEN:-change-me}
      APP_PANEL_INTERNAL_API_SIGNATURE_SECRET: ${APP_INTERNAL_BOT_API_SIGNATURE_SECRET:-}
      APP_PANEL_INTERNAL_API_REQUEST_SIGNING_ENABLED: "true"
      APP_STORAGE_OBJECT_BUCKET: ${APP_STORAGE_OBJECT_BUCKET:-iguana}
      APP_STORAGE_OBJECT_REGION: ${APP_STORAGE_OBJECT_REGION:-us-east-1}
      APP_STORAGE_OBJECT_KEY_PREFIX: ${APP_STORAGE_OBJECT_KEY_PREFIX:-iguana}
      APP_STORAGE_OBJECT_ENDPOINT: http://minio:9000
      APP_STORAGE_OBJECT_ACCESS_KEY: ${APP_STORAGE_OBJECT_ACCESS_KEY:-iguana-minio}
      APP_STORAGE_OBJECT_SECRET_KEY: ${APP_STORAGE_OBJECT_SECRET_KEY:-iguana-minio-secret}
      APP_STORAGE_OBJECT_PATH_STYLE_ACCESS: "true"
      APP_STORAGE_ATTACHMENTS: /opt/iguana/attachments
      APP_STORAGE_WEBFORMS: /opt/iguana/attachments/forms
      APP_BOT_LOG_DIR: /opt/iguana/logs
      APP_BOT_LOG_PATH: /opt/iguana/logs/bot-vk.log
      SHARED_CONFIG_DIR: /opt/iguana/config/shared
      VK_BOT_ENABLED: "true"
      VK_BOT_TOKEN: ${VK_BOT_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-0}
      VK_OPERATOR_CHAT_ID: ${VK_OPERATOR_CHAT_ID:-0}
      VK_WEBHOOK_ENABLED: ${VK_WEBHOOK_ENABLED:-false}
      VK_CONFIRMATION_TOKEN: ${VK_CONFIRMATION_TOKEN:-}
      VK_WEBHOOK_SECRET: ${VK_WEBHOOK_SECRET:-}
      SERVER_PORT: 8080
    ports:
      - "${VK_BOT_BIND_HOST:-127.0.0.1}:${VK_BOT_HTTP_PORT:-18082}:8080"
    volumes:
      - ${IGUANA_SHARED_CONFIG_DIR:-./config/shared}:/opt/iguana/config/shared
      - ${IGUANA_ATTACHMENTS_DIR:-./attachments}:/opt/iguana/attachments
      - ${IGUANA_LOGS_DIR:-./logs}:/opt/iguana/logs

  bot-max:
    profiles: ["legacy-static-bots-disabled"]
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
      args:
        BOT_MODULE: bot-max
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      panel-web:
        condition: service_healthy
    environment:
      APP_DB_MODE: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IGUANA_POSTGRES_DB:-iguana}
      SPRING_DATASOURCE_USERNAME: ${IGUANA_POSTGRES_USER:-iguana}
      SPRING_DATASOURCE_PASSWORD: ${IGUANA_POSTGRES_PASSWORD:-iguana}
      APP_INTEGRATION_TRANSPORT_MODE: rabbitmq
      APP_COORDINATION_MODE: redis
      APP_STORAGE_OBJECT_MODE: s3
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${IGUANA_RABBITMQ_USER:-iguana}
      SPRING_RABBITMQ_PASSWORD: ${IGUANA_RABBITMQ_PASSWORD:-iguana}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${IGUANA_REDIS_PASSWORD:-iguana-redis}
      APP_PANEL_INTERNAL_API_BASE_URL: http://panel-web:8080
      APP_PANEL_INTERNAL_API_TOKEN: ${APP_INTERNAL_BOT_API_TOKEN:-change-me}
      APP_PANEL_INTERNAL_API_SIGNATURE_SECRET: ${APP_INTERNAL_BOT_API_SIGNATURE_SECRET:-}
      APP_PANEL_INTERNAL_API_REQUEST_SIGNING_ENABLED: "true"
      APP_STORAGE_OBJECT_BUCKET: ${APP_STORAGE_OBJECT_BUCKET:-iguana}
      APP_STORAGE_OBJECT_REGION: ${APP_STORAGE_OBJECT_REGION:-us-east-1}
      APP_STORAGE_OBJECT_KEY_PREFIX: ${APP_STORAGE_OBJECT_KEY_PREFIX:-iguana}
      APP_STORAGE_OBJECT_ENDPOINT: http://minio:9000
      APP_STORAGE_OBJECT_ACCESS_KEY: ${APP_STORAGE_OBJECT_ACCESS_KEY:-iguana-minio}
      APP_STORAGE_OBJECT_SECRET_KEY: ${APP_STORAGE_OBJECT_SECRET_KEY:-iguana-minio-secret}
      APP_STORAGE_OBJECT_PATH_STYLE_ACCESS: "true"
      APP_STORAGE_ATTACHMENTS: /opt/iguana/attachments
      APP_STORAGE_WEBFORMS: /opt/iguana/attachments/forms
      APP_BOT_LOG_DIR: /opt/iguana/logs
      APP_BOT_LOG_PATH: /opt/iguana/logs/bot-max.log
      SHARED_CONFIG_DIR: /opt/iguana/config/shared
      MAX_BOT_ENABLED: "true"
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_CHANNEL_ID: ${MAX_CHANNEL_ID:-0}
      MAX_SUPPORT_CHAT_ID: ${MAX_SUPPORT_CHAT_ID:-0}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "${MAX_BOT_BIND_HOST:-127.0.0.1}:${MAX_BOT_HTTP_PORT:-18083}:8080"
    volumes:
      - ${IGUANA_SHARED_CONFIG_DIR:-./config/shared}:/opt/iguana/config/shared
      - ${IGUANA_ATTACHMENTS_DIR:-./attachments}:/opt/iguana/attachments
      - ${IGUANA_LOGS_DIR:-./logs}:/opt/iguana/logs

volumes:
  iguana-postgres-data:
  iguana-rabbitmq-data:
  iguana-redis-data:
  iguana-minio-data:
