global:
  resolve_timeout: 5m

# Phase 2 establishes the durable alert routing/aggregation component.
# This local receiver deliberately has no external transport configured yet;
# external delivery must reuse an approved Iguana notification path rather
# than embedding a new secret/webhook ad hoc in infrastructure YAML.
route:
  receiver: iguana-local
  group_by:
    - alertname
    - severity
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - receiver: iguana-local
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: iguana-local

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"high|medium"
    equal:
      - service
