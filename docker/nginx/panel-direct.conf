resolver 127.0.0.11 valid=5s ipv6=off;

log_format panel_timing escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status"}';
access_log /var/log/nginx/access.log panel_timing;

map $http_host $forwarded_port {
    default $server_port;
    ~^[^:]+:(?<port>\d+)$ $port;
}

upstream panel_web {
    zone panel_web_direct 64k;
    server panel-web:8080 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /internal/observability/ {
        return 404;
    }

    location ~ ^/api/(?:events|general-tickets/events)/stream$ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_pass http://panel_web;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_pass http://panel_web;
    }
}
