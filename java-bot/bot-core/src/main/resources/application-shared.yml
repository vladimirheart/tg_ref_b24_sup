# Iguana shared bot runtime config v13
# Single source of shared defaults for Telegram, VK and MAX bot modules.
# Launcher-specific web application type stays in each application.yml.
spring:
  application:
    name: support-bot
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:${APP_REDIS_PORT:6379}}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:${APP_RABBITMQ_AMQP_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:iguana}
    password: ${SPRING_RABBITMQ_PASSWORD:iguana}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
support-bot:
  token: ${TELEGRAM_BOT_TOKEN:YOUR_TELEGRAM_BOT_TOKEN}
  username: ${TELEGRAM_BOT_USERNAME:your_bot_username}
  channel-id: ${GROUP_CHAT_ID:0}
  database:
    mode: ${APP_DB_MODE:postgresql}
    path: ${SUPPORT_BOT_DATABASE_PATH:${APP_DB_BOT_RUNTIME:${APP_DB_BOT:${APP_DB_PANEL_RUNTIME:${APP_DB_TICKETS:../bot_runtime.db}}}}}
  attachments-dir: ${APP_STORAGE_ATTACHMENTS:../attachments}
  knowledge-base-dir: ${APP_STORAGE_KB:${APP_STORAGE_ATTACHMENTS:../attachments}/knowledge_base}
  webforms-dir: ${APP_STORAGE_WEBFORMS:${APP_STORAGE_ATTACHMENTS:../attachments}/forms}

app:
  coordination:
    mode: ${APP_COORDINATION_MODE:direct}
    lease-namespace: ${APP_COORDINATION_LEASE_NAMESPACE:iguana}
    ingress-lease-ttl: ${APP_COORDINATION_BOT_INGRESS_LEASE_TTL:45s}
    ingress-lease-renew-interval: ${APP_COORDINATION_BOT_INGRESS_RENEW_INTERVAL:15s}
    ingress-follower-backoff: ${APP_COORDINATION_BOT_INGRESS_FOLLOWER_BACKOFF:5s}
    job-lease-ttl: ${APP_COORDINATION_BOT_JOB_LEASE_TTL:2m}
    bot-session-ttl: ${APP_COORDINATION_BOT_SESSION_TTL:24h}
  storage:
    object:
      mode: ${APP_STORAGE_OBJECT_MODE:local_fs}
      bucket: ${APP_STORAGE_OBJECT_BUCKET:}
      region: ${APP_STORAGE_OBJECT_REGION:us-east-1}
      endpoint: ${APP_STORAGE_OBJECT_ENDPOINT:}
      access-key: ${APP_STORAGE_OBJECT_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_OBJECT_SECRET_KEY:}
      path-style-access: ${APP_STORAGE_OBJECT_PATH_STYLE_ACCESS:true}
      key-prefix: ${APP_STORAGE_OBJECT_KEY_PREFIX:iguana}
  integration:
    outbox:
      dispatch-interval-ms: ${APP_INTEGRATION_OUTBOX_DISPATCH_INTERVAL_MS:1500}
    transport:
      mode: ${APP_INTEGRATION_TRANSPORT_MODE:jdbc}
    panel-api:
      base-url: ${APP_PANEL_INTERNAL_API_BASE_URL:http://127.0.0.1:8080}
      token: ${APP_PANEL_INTERNAL_API_TOKEN:iguana-internal-bot-token}
    rabbitmq:
      inbound-exchange: ${APP_INTEGRATION_RABBITMQ_INBOUND_EXCHANGE:iguana.integration.inbound}
      inbound-queue: ${APP_INTEGRATION_RABBITMQ_INBOUND_QUEUE:iguana.integration.inbound.panel}
      ticket-created-queue: ${APP_INTEGRATION_RABBITMQ_TICKET_CREATED_QUEUE:iguana.integration.ticket-created.panel}
      inbound-dlx: ${APP_INTEGRATION_RABBITMQ_INBOUND_DLX:iguana.integration.inbound.dlx}
      inbound-dlq: ${APP_INTEGRATION_RABBITMQ_INBOUND_DLQ:iguana.integration.inbound.panel.dlq}
      ticket-created-dlq: ${APP_INTEGRATION_RABBITMQ_TICKET_CREATED_DLQ:iguana.integration.ticket-created.panel.dlq}
      outbound-exchange: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_EXCHANGE:iguana.integration.outbound}
      outbound-dlx: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_DLX:iguana.integration.outbound.dlx}
      outbound-queue: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_QUEUE:iguana.integration.outbound.feedback-prompt.telegram.channel.0.bot}
      outbound-dlq: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_DLQ:iguana.integration.outbound.feedback-prompt.telegram.channel.0.bot.dlq}
      outbound-routing-key: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_ROUTING_KEY:integration.outbound.feedback.prompt.telegram.channel.0}
      outbound-concurrency: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_CONCURRENCY:1}
      outbound-max-concurrency: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_MAX_CONCURRENCY:4}
      outbound-prefetch: ${APP_INTEGRATION_RABBITMQ_OUTBOUND_PREFETCH:10}
      routing-telegram: ${APP_INTEGRATION_RABBITMQ_ROUTING_TELEGRAM:integration.inbound.telegram}
      routing-vk: ${APP_INTEGRATION_RABBITMQ_ROUTING_VK:integration.inbound.vk}
      routing-max: ${APP_INTEGRATION_RABBITMQ_ROUTING_MAX:integration.inbound.max}
      routing-ticket-created: ${APP_INTEGRATION_RABBITMQ_ROUTING_TICKET_CREATED:integration.inbound.ticket.created}

vk-bot:
  enabled: ${VK_BOT_ENABLED:false}
  token: ${VK_BOT_TOKEN:}
  group-id: ${VK_GROUP_ID:0}
  channel-id: ${VK_OPERATOR_CHAT_ID:0}
  retry-delay-seconds: ${VK_RETRY_DELAY:5}
  webhook-enabled: ${VK_WEBHOOK_ENABLED:false}
  confirmation-token: ${VK_CONFIRMATION_TOKEN:}
  secret: ${VK_WEBHOOK_SECRET:}


max-bot:
  enabled: ${MAX_BOT_ENABLED:false}
  token: ${MAX_BOT_TOKEN:}
  channel-id: ${MAX_CHANNEL_ID:0}
  webhook-secret: ${MAX_WEBHOOK_SECRET:}

logging:
  file:
    name: ${APP_BOT_LOG_PATH:${APP_BOT_LOG_DIR:../logs}/support-bot.log}
  level:
    root: INFO
    org.hibernate.SQL: WARN
