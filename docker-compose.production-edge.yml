services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      panel-web:
        condition: service_healthy
    environment:
      IGUANA_PUBLIC_HOST: ${IGUANA_PUBLIC_HOST:-localhost}
      IGUANA_EDGE_TLS_ENABLED: ${IGUANA_EDGE_TLS_ENABLED:-false}
      NGINX_ENVSUBST_FILTER: ^IGUANA_PUBLIC_HOST$
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        template_dir=/etc/nginx/iguana-templates
        mkdir -p /etc/nginx/templates
        case "$(printf '%s' "${IGUANA_EDGE_TLS_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')" in
          1|true|yes|on)
            cp "$$template_dir/tls.conf.template" /etc/nginx/templates/default.conf.template
            ;;
          *)
            cp "$$template_dir/http-only.conf.template" /etc/nginx/templates/default.conf.template
            ;;
        esac
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "${IGUANA_EDGE_HTTP_BIND_HOST:-0.0.0.0}:${IGUANA_EDGE_HTTP_PORT:-80}:80"
      - "${IGUANA_EDGE_HTTPS_BIND_HOST:-0.0.0.0}:${IGUANA_EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/iguana-templates:ro
      - ${IGUANA_EDGE_CERTS_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
